name: T2 and T3

# T2 and T3 run on every pull request and on main. Together they are the gate
# that must be green before a milestone is called done:
#   * three-platform build and full core test suite
#   * conservation assertions and deterministic replay
#   * clang-format, line endings, dependency direction
#   * clang-tidy
#   * Linux Debug with ASan and UBSan
#   * T3: validation against measured DairyNZ growth curves, with the
#     model-versus-measurement plot kept as an artifact
#   * the Qt6 + VTK map view, built and rendered headlessly on Ubuntu 26.04
#
# The three-platform GUI *packaging* matrix joins this workflow in M3 with the
# 3D view. See docs/adr/0006-ci-scope.md and docs/adr/0010-2d-map-view-with-vtk.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "19"

jobs:
  hygiene:
    name: Format, line endings, dependency direction
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-${LLVM_VERSION}

      - name: clang-format
        run: CLANG_FORMAT=clang-format-${LLVM_VERSION} scripts/check-format.sh

      - name: Line endings and case sensitivity
        run: scripts/check-line-endings.sh

      - name: Dependency direction and core determinism rules
        run: scripts/check-dependency-direction.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-24.04
          - name: macOS (apple clang)
            os: macos-14
          - name: Windows (msvc)
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: where ninja || choco install ninja -y --no-progress

      - name: Configure, build and test
        if: runner.os != 'Windows'
        run: |
          cmake --preset ci-core
          cmake --build --preset ci-core
          ctest --preset ci-core

      # The same presets on Windows, from a Developer Command Prompt so that
      # Ninja can find cl.exe. No editor or CI job keeps its own build settings.
      - name: Configure, build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset ci-core || exit /b 1
          cmake --build --preset ci-core || exit /b 1
          ctest --preset ci-core || exit /b 1

  sanitizers:
    name: Linux Debug (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure, build and test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake --preset ci-asan
          cmake --build --preset ci-asan
          ctest --preset ci-asan

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-${LLVM_VERSION} clang-tidy-${LLVM_VERSION}

      - name: Generate the compile database
        env:
          CC: clang-19
          CXX: clang++-19
        run: cmake --preset ci-tidy

      # The same .clang-tidy the editors read through clangd, so a developer
      # sees this job's findings before they push.
      - name: clang-tidy
        run: |
          run-clang-tidy-${LLVM_VERSION} -p build/ci-tidy -quiet -j "$(nproc)" \
            '^.*/(core|config|app|gis|viz|ai|tests)/.*\.cpp$'

  validation:
    name: T3 validation against measured data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure and build
        run: |
          cmake --preset ci-core
          cmake --build --preset ci-core

      # Tolerance bands against DairyNZ's published seasonal growth averages.
      - name: Validation suite
        run: ctest --preset ci-core -L validation

      # The plot is the point: a reviewer can see the gap between model and
      # measurement without running anything.
      - name: Comparison plot
        run: |
          python3 -m pip install --quiet --break-system-packages matplotlib
          python3 scripts/plot-validation.py build/ci-core/validation/seasonal-growth.csv \
            --out build/ci-core/validation/seasonal-growth.png

      - uses: actions/upload-artifact@v4
        with:
          name: validation-seasonal-growth
          path: build/ci-core/validation/
          if-no-files-found: error

  gui:
    name: Map view (Qt6 + VTK)
    # Ubuntu 26.04 is the first release whose VTK Qt packages are built against
    # Qt6 rather than Qt5; on 24.04 this job would have to build VTK from
    # source. The image is currently a preview one - if that becomes a problem,
    # the fallback is `container: ubuntu:26.04` on a stable runner, which pins
    # the same packages. See docs/adr/0010-2d-map-view-with-vtk.md.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6, VTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libvtk9-qt-dev xvfb libgl1-mesa-dri

      - name: Configure and build
        run: |
          cmake --preset ci-gui
          cmake --build --preset ci-gui

      # Rendering needs a GL context even for a 2D image, so the smoke test runs
      # under a virtual display. It steps the whole scenario, builds every day's
      # rasters and renders one frame; a blank or broken pipeline fails here
      # rather than in front of someone.
      - name: Render the map headlessly
        run: |
          xvfb-run -a ./build/ci-gui/bin/paddock-gui data/scenarios/canterbury-baseline --smoke
