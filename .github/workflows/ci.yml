name: T2 and T3

# T2 and T3 run on every pull request and on main. Together they are the gate
# that must be green before a milestone is called done:
#   * three-platform build and full core test suite
#   * conservation assertions and deterministic replay
#   * clang-format, line endings, dependency direction
#   * clang-tidy, on what a pull request changed and on the whole tree at merge
#   * Linux Debug with ASan and UBSan
#   * T3: validation against measured DairyNZ growth curves, with the
#     model-versus-measurement plot kept as an artifact
#   * the geospatial stack on three platforms: system GDAL and PROJ on Linux
#     and macOS, vcpkg on Windows (docs/adr/0011-gdal-and-proj.md)
#   * the Qt6 + VTK map view, built and rendered headlessly on Ubuntu 26.04
#
# The three-platform GUI *packaging* matrix joins this workflow in M3 with the
# 3D view. See docs/adr/0006-ci-scope.md and docs/adr/0010-2d-map-view-with-vtk.md.
#
# Two rules about how this file fails, both learned the hard way:
#
# Every job carries a timeout-minutes sized at roughly three times what it takes
# when healthy. Without one, a job that hangs holds the pull request for GitHub's
# six-hour default rather than failing and being re-run. The numbers are meant to
# be generous - if one starts firing on healthy runs, raise it rather than
# quietly re-running the job.
#
# Every apt install goes through scripts/ci-apt-install.sh rather than calling
# apt-get directly. GitHub's Ubuntu images point apt at azure.archive.ubuntu.com,
# which intermittently stops answering rather than refusing, and apt waits
# forever by default. That has stalled the clang-tidy and ASan jobs here for
# thirty minutes at a stretch while fetching a 129 kB package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "19"

jobs:
  hygiene:
    name: Format, line endings, dependency direction
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          scripts/ci-apt-install.sh clang-format-${LLVM_VERSION}

      - name: clang-format
        run: CLANG_FORMAT=clang-format-${LLVM_VERSION} scripts/check-format.sh

      - name: Line endings and case sensitivity
        run: scripts/check-line-endings.sh

      - name: Dependency direction and core determinism rules
        run: scripts/check-dependency-direction.sh

  build:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-24.04
          - name: macOS (apple clang)
            os: macos-14
          - name: Windows (msvc)
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-apt-install.sh ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: where ninja || choco install ninja -y --no-progress

      - name: Configure, build and test
        if: runner.os != 'Windows'
        run: |
          cmake --preset ci-core
          cmake --build --preset ci-core
          ctest --preset ci-core

      # The same presets on Windows, from a Developer Command Prompt so that
      # Ninja can find cl.exe. No editor or CI job keeps its own build settings.
      - name: Configure, build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset ci-core || exit /b 1
          cmake --build --preset ci-core || exit /b 1
          ctest --preset ci-core || exit /b 1

  sanitizers:
    name: Linux Debug (ASan + UBSan)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: scripts/ci-apt-install.sh ninja-build

      - name: Configure, build and test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake --preset ci-asan
          cmake --build --preset ci-asan
          ctest --preset ci-asan

  tidy:
    name: clang-tidy
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      # Full history, because working out what a pull request changed needs the
      # base branch to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          scripts/ci-apt-install.sh ninja-build clang-${LLVM_VERSION} clang-tidy-${LLVM_VERSION}

      - name: Generate the compile database
        env:
          CC: clang-19
          CXX: clang++-19
        run: cmake --preset ci-tidy

      # Decide what to lint before linting it.
      #
      # A full pass is 75 translation units and takes 5m42s - more than the
      # other ten jobs together, and almost all of it re-checking files the
      # change never touched. A pull request usually moves two or three.
      #
      # The catch is that a header change can break a translation unit that did
      # not change, so the saving only applies when nothing with fan-out moved.
      # A touched .hpp, .clang-tidy or CMakeLists.txt means the whole tree, and
      # so does every push to main - so main is always fully linted, and a
      # narrow pull-request pass can never be the last word.
      - name: Work out what to lint
        id: scope
        run: |
          # This pattern is wider than the compile database behind it. The
          # ci-tidy preset builds with the GUI off, so app/src/gui and
          # viz/src/MapScene.cpp are not in it and are linted by the map-view
          # job instead, where Qt and VTK are already installed. Naming them
          # here is harmless - run-clang-tidy only visits what the database
          # holds - and the alternative, a pattern that lies the other way,
          # would leave them looking covered.
          full='^.*/(core|config|app|gis|viz|ai|tests)/.*\.cpp$'

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "reason=every file: this is not a pull request" >> "$GITHUB_OUTPUT"
            echo "pattern=${full}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "${base}...HEAD")
          echo "changed files:"
          echo "${changed}" | sed 's/^/  /'

          if echo "${changed}" | grep -qE '(\.hpp|\.h)$|^\.clang-tidy$|CMakeLists\.txt$'; then
            echo "reason=every file: a header, .clang-tidy or CMakeLists.txt changed" >> "$GITHUB_OUTPUT"
            echo "pattern=${full}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sources=$(echo "${changed}" | grep -E '^(core|config|app|gis|viz|ai|tests)/.*\.cpp$' || true)
          if [ -z "${sources}" ]; then
            echo "reason=nothing to lint: no source file changed" >> "$GITHUB_OUTPUT"
            echo "pattern=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pattern=$(echo "${sources}" | sed 's/[.]/[.]/g' | paste -sd'|' -)
          echo "reason=only what this pull request changed" >> "$GITHUB_OUTPUT"
          echo "pattern=^.*/(${pattern})$" >> "$GITHUB_OUTPUT"

      # The same .clang-tidy the editors read through clangd, so a developer
      # sees this job's findings before they push.
      - name: clang-tidy
        run: |
          echo "scope: ${{ steps.scope.outputs.reason }}"
          if [ -z '${{ steps.scope.outputs.pattern }}' ]; then
            exit 0
          fi
          run-clang-tidy-${LLVM_VERSION} -p build/ci-tidy -quiet -j "$(nproc)" \
            '${{ steps.scope.outputs.pattern }}'

  validation:
    name: T3 validation against measured data
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: scripts/ci-apt-install.sh ninja-build

      - name: Configure and build
        run: |
          cmake --preset ci-core
          cmake --build --preset ci-core

      # Tolerance bands against DairyNZ's published seasonal growth averages.
      - name: Validation suite
        run: ctest --preset ci-core -L validation

      # The plot is the point: a reviewer can see the gap between model and
      # measurement without running anything.
      - name: Comparison plot
        run: |
          python3 -m pip install --quiet --break-system-packages matplotlib
          python3 scripts/plot-validation.py build/ci-core/validation/seasonal-growth.csv \
            --out build/ci-core/validation/seasonal-growth.png

      - uses: actions/upload-artifact@v4
        with:
          name: validation-seasonal-growth
          path: build/ci-core/validation/
          if-no-files-found: error

  gis:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    # Linux and macOS take GDAL and PROJ from the system package manager, which
    # also ships PROJ's proj.db where PROJ already looks for it. Windows takes
    # them from vcpkg and lives in the gis-windows job below, run on request
    # rather than on every pull request - the measurement that decided that is
    # recorded there. See docs/adr/0011-gdal-and-proj.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GIS Linux (apt, GDAL 3.8)
            os: ubuntu-24.04
          - name: GIS macOS (brew)
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL, PROJ and Ninja (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-apt-install.sh ninja-build libgdal-dev libproj-dev

      - name: Install GDAL, PROJ and Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja gdal proj

      - name: Report the versions actually installed
        run: |
          gdal-config --version
          proj 2>&1 | head -1 || true

      - name: Configure, build and test
        run: |
          cmake --preset ci-gis
          cmake --build --preset ci-gis
          ctest --preset ci-gis -L gis --output-on-failure

  # Windows geospatial builds run on request, not on every pull request.
  #
  # Measured, not guessed: on the first green run the same suite took 1m14s on
  # Linux, 2m54s on macOS and 1h3m47s on Windows. The hour is vcpkg compiling
  # GDAL and its dependency fan-out from source. The binary cache removes it
  # only when a cache exists in a scope the run can read, and Actions caches are
  # scoped per branch - so a new feature branch pays the hour again. One job was
  # costing more than the other ten put together.
  #
  # What stands in for it is a local build: gis/ is verified on Windows on a
  # developer machine with vcpkg before merging, and docs/setup.md gives the
  # command. That is weaker than a gate, and it is written down as weaker rather
  # than quietly dropped. Run this job from the Actions tab whenever gis/ changes
  # in a way MSVC might see differently from GCC and Clang. The three-platform
  # GUI packaging matrix that ADR 0006 defers to M3 brings Windows back on a
  # cadence of its own.
  gis-windows:
    name: GIS Windows (vcpkg, on request)
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        shell: cmd
        run: where ninja || choco install ninja -y --no-progress

      # The runner image ships its own vcpkg checkout at whatever commit the
      # image was built from, and vcpkg.json pins a different one. Fetching the
      # pinned commit is not enough: vcpkg resolves versions from the baseline's
      # database but builds the ports in the working tree, so a tree carrying
      # expat 2.8.3 against a baseline database that stops at 2.8.2 fails with
      # "no version database entry". The tree has to be moved to the pin, not
      # just told about it.
      - name: Check the vcpkg tree out at the pinned baseline
        shell: bash
        run: |
          baseline=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "vcpkg baseline pinned in vcpkg.json: ${baseline}"
          git -C "${VCPKG_INSTALLATION_ROOT}" fetch --depth=1 origin "${baseline}"
          git -C "${VCPKG_INSTALLATION_ROOT}" checkout --force FETCH_HEAD
          "${VCPKG_INSTALLATION_ROOT}/bootstrap-vcpkg.bat"
          git -C "${VCPKG_INSTALLATION_ROOT}" log -1 --format="vcpkg now at %H (%ci)"

      # GDAL from source is the expensive part of this job on Windows: measured
      # at 75 minutes on a cold cache, and identical from run to run.
      #
      # Restore and save are separate steps on purpose. actions/cache writes
      # nothing when the job fails, so the first failed run threw away
      # seventy-five minutes of correctly built packages and the next attempt
      # paid for them again. Saving on always() means a run only ever pays that
      # cost once, whatever the tests then say.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-gdal-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-gdal-${{ runner.os }}-

      - name: Configure, build and test
        shell: cmd
        # PROJ_DATA is PROJ's own documented mechanism for finding proj.db, and
        # on Windows it has to be used. A vcpkg PROJ searches
        # %LOCALAPPDATA%\proj by default and installs its database under
        # vcpkg_installed\x64-windows\share\proj, so out of the box it finds
        # nothing and every transform fails - which is exactly what
        # GisEnvironmentTest.ProjCanResolveNztm2000 reported on the first run of
        # this job. Linux and macOS packages put proj.db where their PROJ
        # already looks, so they need none of this.
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset ci-gis -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake || exit /b 1
          cmake --build --preset ci-gis || exit /b 1
          set PROJ_DATA=%CD%\build\ci-gis\vcpkg_installed\x64-windows\share\proj
          echo PROJ_DATA=%PROJ_DATA%
          ctest --preset ci-gis -L gis --output-on-failure || exit /b 1

      - name: Save the vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  gui:
    name: Map view (Qt6 + VTK)
    timeout-minutes: 30
    # Ubuntu 26.04 is the first release whose VTK Qt packages are built against
    # Qt6 rather than Qt5; on 24.04 this job would have to build VTK from
    # source. The image is currently a preview one - if that becomes a problem,
    # the fallback is `container: ubuntu:26.04` on a stable runner, which pins
    # the same packages. See docs/adr/0010-2d-map-view-with-vtk.md.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # The largest install in the workflow, and it got larger when clang-tidy
      # arrived: clang-tools-19 pulls a JRE behind it. This job has thirty
      # minutes, so it can afford to wait out a slow mirror rather than have an
      # attempt killed mid-fetch.
      - name: Install Qt6, VTK, clang-tidy and a virtual display
        env:
          CI_APT_TIMEOUT: 900
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          scripts/ci-apt-install.sh ninja-build qt6-base-dev libvtk9-qt-dev xvfb libgl1-mesa-dri \
            clang-${LLVM_VERSION} clang-tidy-${LLVM_VERSION}

      # Built with clang rather than the default gcc, so the compile database
      # matches the clang-tidy that reads it below - the same reason the
      # ci-tidy preset takes its compiler from CC/CXX. GCC coverage is the
      # Linux (gcc) job's business, not this one's.
      - name: Configure and build
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          cmake --preset ci-gui
          cmake --build --preset ci-gui

      # The clang-tidy job cannot see any of this. Its compile database is built
      # with the GUI off, so every file under app/src/gui and viz/src/MapScene
      # has been outside the lint gate since the map view was added - which is
      # not theoretical: turning it on found five errors, including a narrowing
      # conversion and two parameters copied for every call.
      #
      # It runs here rather than there because Qt and VTK are already installed
      # in this job and installing them in the other one would cost more than
      # this whole job takes.
      - name: clang-tidy over the GUI
        run: |
          run-clang-tidy-${LLVM_VERSION} -p build/ci-gui -quiet -j "$(nproc)" \
            '^.*/(app/src/gui|viz/src|tests/viz)/.*\.cpp$'

      # Where the map puts things, which a rendered frame does not check: the
      # field was once drawn half a cell south-west of the ground it described
      # and looked entirely reasonable.
      - name: Map placement
        run: |
          xvfb-run -a ctest --test-dir build/ci-gui -R MapSceneTest --output-on-failure

      # Rendering needs a GL context even for a 2D image, so the smoke test runs
      # under a virtual display. It steps the whole scenario, builds every day's
      # rasters and renders one frame; a blank or broken pipeline fails here
      # rather than in front of someone.
      - name: Render the map headlessly
        run: |
          xvfb-run -a ./build/ci-gui/bin/paddock-gui data/scenarios/canterbury-baseline --smoke

      # The sun and the sky, which a screenshot of the render window cannot
      # show: the weather line lives in a label around it, and a farm that
      # falls six metres in a kilometre looks much the same under any sun.
      - name: Say what the weather was
        run: |
          xvfb-run -a ./build/ci-gui/bin/paddock-gui data/scenarios/lincoln-lurdf --smoke             | grep -q "paddock-gui: weather "

      # Changing farms, which no single frame can check: the two bundles below
      # are thirteen kilometres apart, so a camera left on the first one shows
      # an empty window - which looks exactly like a broken pipeline and is
      # not one. paddock-gui checks the camera landed inside the new farm and
      # exits non-zero if it did not.
      - name: Follow the farm when it changes
        run: |
          xvfb-run -a ./build/ci-gui/bin/paddock-gui data/scenarios/canterbury-baseline --smoke             --then data/scenarios/lincoln-lurdf

      # And that the fences land on the field rather than beside it. A PNG is
      # the only way to check that without a person at the screen, and it is
      # kept so a reviewer can look at what the run actually drew.
      - name: Draw a grazed day
        run: |
          xvfb-run -a ./build/ci-gui/bin/paddock-gui data/scenarios/canterbury-grazed             --screenshot grazed-day.png

      - uses: actions/upload-artifact@v4
        with:
          name: map-grazed-day
          path: grazed-day.png
