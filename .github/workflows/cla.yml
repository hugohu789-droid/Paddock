name: CLA

# Contributor License Agreement gate. Paddock is GPL-3.0-or-later; a CLA is
# what keeps the option of relicensing the same code commercially, because
# only the holder of every contributor's copyright can offer other terms.
#
# The trigger is pull_request_target, not pull_request. A pull_request event
# raised from a fork runs with a read-only token and no access to secrets, so
# the bot could neither comment on the PR nor write the signature file - and a
# fork is exactly the case a CLA exists for. pull_request_target runs in the
# base repository's context, which is what gives it those permissions. It also
# means this workflow must never check out or execute the pull request's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check the contributor licence agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # "recheck" lets a maintainer re-run the gate after a signature; the
    # signature phrase is what a contributor comments to sign.
    if: >
      (github.event.comment.body == 'recheck' ||
       startsWith(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      # contributor-assistant/github-action is the canonical name; the
      # cla-assistant/github-action this first referenced is a rename that
      # GitHub still redirects. The repository is ARCHIVED as of 2026-03-23 and
      # takes no further changes - see docs/cla.md for what that means and what
      # the exits are. Pinned to the last release rather than to a moving tag,
      # because an unmaintained action will not be fixed if a tag moves under
      # us.
      - name: CLA assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only because the signatures live in a separate repository:
          # the default GITHUB_TOKEN is scoped to this one. The secret must be
          # set on THIS repository - Actions cannot read a secret stored on the
          # signatures repository, which is where it first went.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/hugohu789-droid/Paddock/blob/main/docs/cla.md
          branch: main
          allowlist: hugohu789-droid,dependabot[bot]
          remote-organization-name: hugohu789-droid
          remote-repository-name: Paddock-cla-signatures
