name: T5

# T5 is the delivery gate: it runs on a version tag and turns a green commit
# into something a person can download and open.
#
#   * a Linux desktop package, built on the same Ubuntu 26.04 image and the
#     same Qt6 + VTK packages the T2 map-view job already proves
#   * a macOS desktop package, Qt and VTK from Homebrew, through macdeployqt
#   * the API documentation, published to GitHub Pages
#   * a GitHub Release carrying whatever packages were built
#
# **Windows packages are built locally and attached by hand, and that is
# written down rather than quietly skipped.** Qt and VTK are not available as
# binaries to a Windows runner the way they are through apt and Homebrew;
# building them from source costs hours per run, and the same measurement that
# kept the geospatial suite off Windows pull requests applies here (see the
# gis-windows job in ci.yml). What stands in for it is scripts/package-release.sh
# run on a developer machine, which deploys Qt with windeployqt, copies VTK and
# the GDAL fan-out beside it, and refuses to finish unless the staged tree runs.
# docs/adr/0013-release-packaging.md records the trade and what would reverse it.
#
# Run this from the Actions tab against any branch to rehearse it. Only a tag
# creates a release; a manual run stops after building and uploading artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package:
    name: ${{ matrix.name }}
    # Windows builds Qt6, VTK and GDAL from source and needs hours on a cold
    # cache; the other two install them in minutes and should not be allowed to
    # hang for that long.
    timeout-minutes: ${{ matrix.timeout }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Package Linux (apt Qt6 + VTK)
            os: ubuntu-26.04
            timeout: 45
          - name: Package macOS (brew Qt6 + VTK)
            os: macos-14
            timeout: 45
          # **Windows builds its whole stack from source, and that is the cost.**
          # Linux and macOS take Qt6, VTK and GDAL from a package manager in a
          # couple of minutes. Windows has no such source, so vcpkg builds
          # qtbase, vtk and gdal itself - and GDAL alone is measured at 75
          # minutes on a cold cache in ci.yml's gis-windows job, with Qt and VTK
          # larger again. The first run of this is hours; every run after it
          # restores from the binary cache below.
          #
          # v0.1.0 shipped without a Windows archive because this leg did not
          # exist, which for a Qt desktop application is the wrong platform to
          # be missing. Prime the cache with a manual run from the Actions tab
          # before tagging, or the tag pays for it.
          - name: Package Windows (vcpkg Qt6 + VTK)
            os: windows-2022
            timeout: 350
    steps:
      - uses: actions/checkout@v4

      # The runner ships a vcpkg at whatever commit the image was built from and
      # vcpkg.json pins a different baseline. The same dance as gis-windows, for
      # the same reason.
      - name: Check the vcpkg tree out at the pinned baseline
        if: runner.os == 'Windows'
        shell: bash
        run: |
          baseline=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "vcpkg baseline pinned in vcpkg.json: ${baseline}"
          git -C "${VCPKG_INSTALLATION_ROOT}" fetch --depth=1 origin "${baseline}"
          git -C "${VCPKG_INSTALLATION_ROOT}" checkout --force FETCH_HEAD
          "${VCPKG_INSTALLATION_ROOT}/bootstrap-vcpkg.bat"

      # Restore and save separately, so a run that fails its tests still keeps
      # the packages it spent hours building. gis-windows learned that the
      # expensive way and the comment there says so.
      - name: Restore the vcpkg binary cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-desktop-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-desktop-${{ runner.os }}-

      - name: Install Qt6, VTK and the geospatial stack (Linux)
        if: runner.os == 'Linux'
        env:
          CI_APT_TIMEOUT: 900
        run: |
          command -v ninja || scripts/ci-apt-install.sh ninja-build
          scripts/ci-apt-install.sh qt6-base-dev qt6-charts-dev libvtk9-qt-dev \
            libgdal-dev libproj-dev xvfb libgl1-mesa-dri

      - name: Install Qt6, VTK and the geospatial stack (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja qt vtk gdal proj

      # The desktop preset is the one a release is made of: the map, the terrain
      # view and the geospatial stack that lets a scenario be drawn on the
      # ground it names.
      - name: Configure and build
        if: runner.os != 'Windows'
        run: |
          cmake --preset desktop
          cmake --build --preset desktop

      # **Windows names its toolchain, because the presets do not.** A vcpkg root
      # is a machine-local path, so CMakePresets.json leaves it out and
      # CMakeUserPresets.json supplies it on a developer's machine. CI has no
      # user presets, so it passes the file the way gis-windows does.
      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset desktop -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake || exit /b 1
          cmake --build --preset desktop || exit /b 1

      # The scientific suite, on the artefact that is about to be shipped rather
      # than on a build made for the purpose. A release that has not run its own
      # conservation assertions is a release nobody checked.
      - name: Test what is being shipped
        if: runner.os != 'Windows'
        run: ctest --test-dir build/desktop --output-on-failure

      # PROJ on Windows searches %LOCALAPPDATA%\proj and a vcpkg PROJ installs its
      # database elsewhere, so without this every coordinate transform fails.
      # The same note as gis-windows, and the same fix.
      - name: Test what is being shipped (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PROJ_DATA=%CD%\build\desktop\vcpkg_installed\x64-windows\share\proj
          ctest --test-dir build/desktop --output-on-failure || exit /b 1

      - name: Save the vcpkg binary cache
        if: always() && runner.os == 'Windows'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # Bash on Windows is Git Bash, which the runner has. One script on all
      # three platforms; it picks its own suffixes and archive format.
      - name: Package
        shell: bash
        run: scripts/package-release.sh --build build/desktop --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: paddock-${{ runner.os }}
          # Windows produces a zip and the other two a tarball, which is what a
          # person on each platform expects to be handed.
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  docs:
    name: API documentation
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: scripts/ci-apt-install.sh doxygen graphviz

      # The tag is the version on the front page. A manual rehearsal has no tag,
      # so it says so rather than inventing one.
      - name: Generate
        run: |
          version="${GITHUB_REF_NAME}"
          case "${GITHUB_REF}" in
            refs/tags/*) ;;
            *) version="${version} (unreleased)" ;;
          esac
          ( cat Doxyfile; echo "PROJECT_NUMBER = ${version}" ) | doxygen -
          test -f html/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: html

  publish-docs:
    name: Publish to GitHub Pages
    needs: docs
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    needs: [package, docs]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # **The pattern is not optional.** Without it this downloads every artifact
      # the run produced, and the docs job uploads one too - so v0.1.0's release
      # carried `artifact.tar`, fourteen megabytes of Doxygen call graphs, sitting
      # beside the archives with nothing to say what it was.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: paddock-*
          merge-multiple: true

      - name: What is about to be released
        run: ls -lh artifacts

      # Draft, not published. The Windows package is attached by hand before
      # this goes out, and a draft is what makes that step possible rather than
      # a race against people already downloading an incomplete release.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Paddock ${GITHUB_REF_NAME}" \
            --notes "Desktop packages for Linux and macOS. The Windows package is attached before this draft is published; see docs/adr/0013-release-packaging.md.

          Each archive carries the simulator, the scenarios it can run without fetching anything, and NOTICE.txt naming the licence of every piece of third-party data inside it. Ground elevation is not shipped: the scenarios that name it draw flat and say how to fetch it." \
            artifacts/*
