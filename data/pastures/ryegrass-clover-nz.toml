# Perennial ryegrass and white clover, as this model has them.
#
# **One file, because these are properties of the plants rather than of a farm.**
# Four scenarios used to carry four sward files: the Lincoln one had every
# parameter this project has sourced, and the other three were byte-identical
# copies of the placeholder set it started from - a radiation use efficiency of
# 1.5 against the 0.639 fitted here, a triangular temperature response, no
# drought term and no reproductive season. So the work of E62 to E69 reached one
# scenario out of four, and Ruakura grew nineteen tonnes of dry matter a hectare
# (verify.md, E80).
#
# What legitimately differs between those farms is weather, soil, latitude and
# stock, and every one of those is stated by the scenario rather than here.
#
# **The radiation use efficiency is the one fitted number**, and it was fitted at
# Lincoln to Canterbury dryland water use efficiency. Applied at Ruakura it is a
# prediction rather than a fit, and should be read as one.

# A perennial ryegrass and white clover sward, with its radiation use
# efficiency calibrated against Canterbury dryland production.
#
# **One parameter is FITTED and the rest are still PLACEHOLDER.** Radiation use
# efficiency was 1.5 g DM/MJ for the grass and 1.4 for the clover, both
# unsourced, and with them this farm converted water to dry matter at 19.8 kg
# DM/ha/mm - which Martin et al. (2006) give for *irrigated* ryegrass and white
# clover, against 12.3 for Canterbury dryland. A rain-fed farm running at an
# irrigated efficiency grows about 1.6 times what its rainfall buys, and that
# is why no dry year could ever pinch it.
#
# **Water use efficiency turned out to be the only thing that could be fitted
# here**, and it is worth saying why. Growth and evapotranspiration are both
# scaled by the same water stress coefficient, so their ratio does not depend on
# the water balance at all: making the soil shallower cut growth and ET by the
# same factor and left WUE at 19.8 to three figures. The ratio is set by
# radiation use efficiency and the temperature response, and of those two only
# RUE has no source.
#
# FITTED TO: `data/calibration/canterbury-dryland-pasture.csv`, specifically the
# dryland water use efficiency of 12.3 kg DM/ha/mm measured at Winchmore -
# 1.5 x 12.3/19.8 = 0.932, and 1.4 x 12.3/19.8 = 0.870. One scalar, one target,
# applied to both species so their balance is unchanged. **This is a fit and not
# a measurement**: it makes the model reproduce a published efficiency it was
# not reproducing, and it does not make 0.932 a measured radiation use
# efficiency for ryegrass. The independent check is annual production, which
# nothing was fitted to - see the validation test.
#
# Everything else here is still PLACEHOLDER: specific leaf area, extinction,
# senescence, the temperature cardinals and the decomposition rate. See
# docs/validation/verify.md, E7 and E21.

[sward]
# Photosynthetically active radiation as a share of global solar radiation.
par_fraction = 0.5  # PLACEHOLDER - conventional value, no source recorded yet

# Share of the dead pool that leaves the standing crop each day.
#
# **This alone decides how much of the sward is dead.** At equilibrium the dead
# pool settles where senescence in equals decomposition out, so the dead share
# of standing dry matter is s / (s + d) - and this file used to carry 0.02
# against a senescence of 0.02, which is exactly half dead whatever else the
# model did. It measured 50 to 64%.
#
# **What the pool actually holds is standing dead**, and that leaves fast: it is
# trodden in, broken off and taken incidentally in a mouthful, and it stops
# being part of the standing crop in about a week. True decomposition to soil
# organic matter is far slower - standing dead in a dry savanna loses only 40%
# of its weight in two years - but this model has no litter layer beneath the
# sward, so the one rate it has is the one that governs cover, and cover is what
# a plate meter reads and what a farmer manages to.
#
# **FITTED, and to the outcome rather than to itself.** No measured
# disappearance rate for New Zealand standing dead has been found. What is
# described is the outcome: rotational grazing "circumvents the accumulation of
# dead matter", low-stocked swards leave "greater potential for dead material to
# accumulate", and a dry autumn pasture "may contain predominantly dead
# material". 0.12 a day - about eight days' residence - puts this farm at 3 to
# 16% dead through the year, which is a well-managed sward's territory. The
# validation test holds it there, so the fit is checked rather than asserted.
#
# It is the most sensitive figure in the sward, and the one to replace first if
# a measured disappearance rate turns up.
decomposition_rate_per_day = 0.12  # FITTED - see the note above

[grass]
species_id = "ryegrass_perennial"
specific_leaf_area_m2_per_kg = 20.0        # PLACEHOLDER
extinction_coefficient = 0.5               # PLACEHOLDER - published range 0.3 to 1.3
# FITTED to Winchmore's dryland water use efficiency - see the header. Was an
# unsourced 1.5.
radiation_use_efficiency_g_per_mj = 0.639
# **The cardinal temperatures, and the exponent that goes with them.** These
# used to be a sourced base and two PLACEHOLDERs, and the placeholders were
# carrying the model's whole seasonal shape: a triangle from 4.4 C to an optimum
# of 20 hands Canterbury's 16.9 C summer 80% of the response and its 11.9 C
# spring only 48%, which is most of the reason the model grew its year in the
# wrong order (E64).
#
# **DIRECT** - APSIM AgPasture's ryegrass, from Models/Resources/AGPRyegrass.json:
# GrowthTminimum 2.0, GrowthToptimum 20.0, GrowthTEffectExponent 1.50. Its own
# optimum is 20.0, so the placeholder happened to be right about that one and
# wrong about everything around it.
#
# `maximum_temperature_c` is not stated by AgPasture; it derives it as
# optimum + (optimum - base) / exponent = 20 + 18 / 1.5 = 32.0, and that is the
# figure below rather than an independent guess. The three must move together.
#
# Model: Li FY, Snow VO & Holzworth DR (2011), NZ Journal of Agricultural
# Research 54: 331-352.
base_temperature_c = 2.0
optimum_temperature_c = 20.0
maximum_temperature_c = 32.0
temperature_response_exponent = 1.5
# A fallback now, and used only if the leaf lifespan below is removed.
senescence_rate_per_day = 0.02             # PLACEHOLDER

# **How long a leaf lives, in thermal time.**
#
# DairyNZ call ryegrass a "three leaf plant": a tiller sustains three live
# leaves, so when the fourth appears the first dies and a leaf therefore lives
# three leaf-appearance intervals. That is the mechanism, and it is what makes
# senescence a season rather than a number - a leaf turns over in a fortnight in
# a Canterbury January and takes months in July.
#
# **Two sources disagree about the interval and both are recorded.** DairyNZ
# state it directly - "a new leaf growing every 8 days in mid-spring" - which at
# Lincoln's measured October mean of 11.9 C, 7.5 degree-days a day above this
# species' 4.4 C base, works out at 60 degree-days a leaf. The published
# phyllochron for a ryegrass is about double that: 120 +- 4.2 degree-days a
# leaf for Italian ryegrass, a congener of this one.
#
# 120 is used, and the reason is that the two are not measuring the same sward.
# DairyNZ's audience is irrigated, fertilised dairy pasture, which pushes leaves
# out roughly twice as fast as the unfertilised dryland this farm is. Running
# the model at 60 made the point: leaf died faster than the stock could graze
# it, the sward handed its animals 6% of what it grew, and the farm sold down to
# 44 head. That is not a Canterbury farm; it is a dairy phyllochron on a dryland
# block.
#
# **VERIFY** - Italian ryegrass is a relative and not this species, and no
# perennial ryegrass figure has been read directly.
degree_days_per_leaf = 120.0
leaves_per_tiller = 3.0

# **The spring flush, standing in for a phenology this model does not have.**
# Ryegrass turns reproductive in spring - stem elongation and a seed head - and
# puts a far larger share of what it fixes into shoot while it does. Paddock has
# no phenology at all, so it grows whenever light, warmth and water allow, and
# in Canterbury those peak in January. Measured against Winchmore's 25 years,
# spring beats summer 25 times out of 25 there and 8 times in 10 here (E67).
#
# **DIRECT** - AgPasture's `ReproductiveGrowthFactor`, whose own documentation
# says what it is: "Reproductive phase of perennial is not simulated by the
# model, the ReproductiveGrowthFactor attempts to mimic the main effect, which
# is a higher allocation of DM to shoot during this period." The seven values
# below are that class's own defaults; the species resource files override none
# of them. Li FY, Snow VO & Holzworth DR (2011), NZJAR 54: 331-352.
#
# **Every number in the curve comes from latitude**, which is what separates
# adopting this from fitting a seasonal multiplier to the trial it is checked
# against, and what lets one sward file serve farms at different latitudes.
# Nothing here was chosen by looking at Winchmore. At Lincoln's -43.641 it works
# out as a season opening on 1 September, a 35.8-day ramp to a plateau on 7
# October, 59.6 days at full effect, and a 23.9-day taper ending 29 December,
# with shoot allocation up 28.3% at the peak - Winchmore's biggest months, in
# order, are October, November, September, December. At Ruakura's -37.8 the
# season opens earlier and runs longer, which is what a Waikato spring does.
# The scenario states its latitude in [run]; this file states none.
#
# **What it is worth, honestly**: about a quarter of the remaining seasonal gap.
# It does not restore the 25-in-25 signature - a 28% spring boost cannot
# outweigh a summer that grows 3,900 kg DM/ha when the rain comes - and it costs
# a little of the winter and autumn that E64 got right. See ADR 0018.
#
# Zero for the increase turns the season off. AgPasture has it on by default;
# this file says so explicitly.
repro_season_max_allocation_increase = 0.50
repro_season_reference_latitude_degrees = 41.0
repro_season_timing_coefficient = 0.14
repro_season_duration_coefficient = 2.0
repro_season_shoulders_length_factor = 1.0
repro_season_onset_duration_factor = 0.60
repro_season_allocation_coefficient = 0.10

# **The other half of what a drought does.** The leaf lifespan above slows the
# tiller down when the soil dries, which keeps leaf alive; a drought also kills
# the leaf the plant is already carrying, and until E62 nothing here did that.
# On this farm's weather the two effects had been cancelling almost exactly -
# spring 7.5 degree-days times a water factor of 0.618 is 4.64, summer 12.5
# times 0.366 is 4.59 - so leaf lived 78 days in a February drought and 78 days
# in an October spring, cover never fell, and summer went on growing.
#
# Below the threshold, turnover is multiplied by
#     1 + max * ((threshold - Ks) / threshold) ^ exponent
# which is 1.0 in a wet spring and 2.0 on a profile at wilting point.
#
# **DIRECT** - APSIM AgPasture's `MoistureEffectOnTissueTurnover`, with the
# values its own ryegrass and white clover carry (identical for both):
# Models/Resources/AGPRyegrass.json and AGPWhiteClover.json. The model is
# Li FY, Snow VO & Holzworth DR (2011), "Modelling the seasonal and geographical
# pattern of pasture production in New Zealand", NZ Journal of Agricultural
# Research 54: 331-352 - a model calibrated on this exact question.
drought_turnover_threshold = 0.6
drought_turnover_effect_max = 1.0
drought_turnover_exponent = 2.0

# Crown and stubble that do not senesce and that the plant regrows from.
residual_kg_dm_per_ha = 400.0              # PLACEHOLDER
nitrogen_content_fraction = 0.035          # PLACEHOLDER
# A grass fixes nothing; the key may be omitted entirely.
nitrogen_fixation_kg_per_t_dm = 0.0

[legume]
species_id = "clover_white"
specific_leaf_area_m2_per_kg = 25.0        # PLACEHOLDER
extinction_coefficient = 0.6               # PLACEHOLDER
# FITTED with the same scalar as the grass, so the two species keep the balance
# they had. Was an unsourced 1.4.
radiation_use_efficiency_g_per_mj = 0.596
# **DIRECT** - AgPasture's white clover, from AGPWhiteClover.json:
# GrowthTminimum 3.5, GrowthToptimum 23.0, GrowthTEffectExponent 1.65. The
# maximum is AgPasture's derived one, 23 + 19.5 / 1.65 = 34.82. See the grass
# block above for the model and the reason the shape matters.
base_temperature_c = 3.5
optimum_temperature_c = 23.0
maximum_temperature_c = 34.82
temperature_response_exponent = 1.65
senescence_rate_per_day = 0.025            # PLACEHOLDER

# **PLACEHOLDER, and taken from the grass.** White clover is a stolon rather
# than a tiller and its leaves are trifoliate, so "three live leaves" is the
# wrong picture for it - the number here is the ryegrass figure carried across
# because no clover equivalent has been read, and the shape of the seasonal
# response matters more than its exact level. See docs/validation/verify.md.
degree_days_per_leaf = 120.0
leaves_per_tiller = 3.0

# The same seven, because AgPasture applies this to its white clover too and
# overrides none of them. **This is faithfulness, not a claim about clover**:
# white clover flowers in summer rather than running up a spring seed head, so a
# spring allocation shift is a poorer description of it than of the grass. It is
# here because the source applies it to both, and departing from that would be a
# judgement this file has no evidence for. Listed in verify.md.
repro_season_max_allocation_increase = 0.50
repro_season_reference_latitude_degrees = 41.0
repro_season_timing_coefficient = 0.14
repro_season_duration_coefficient = 2.0
repro_season_shoulders_length_factor = 1.0
repro_season_onset_duration_factor = 0.60
repro_season_allocation_coefficient = 0.10

# The same three figures: AgPasture gives its white clover exactly what it gives
# its ryegrass. DIRECT, from AGPWhiteClover.json - see the grass block above for
# the citation and the mechanism.
drought_turnover_threshold = 0.6
drought_turnover_effect_max = 1.0
drought_turnover_exponent = 2.0

residual_kg_dm_per_ha = 100.0              # PLACEHOLDER
nitrogen_content_fraction = 0.045          # PLACEHOLDER
# Published New Zealand range is 20 to 28 kg N fixed per tonne of clover dry
# matter; 25 is mid-range. Note this is below the nitrogen a tonne of clover
# contains, so clover draws on soil nitrogen as well as on the air.
nitrogen_fixation_kg_per_t_dm = 25.0
