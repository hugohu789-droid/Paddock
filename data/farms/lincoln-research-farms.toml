# Lincoln University Research Dairy Farm (LURDF), Weedons Road, Canterbury.
#
# The rolling/complex-terrain case of the three examples, and the one whose
# weather the project already has: the CliFlo snapshot script defaults to
# Lincoln (NIWA agent 4881), and the DairyNZ Lincoln P21 series is the T3
# validation reference.
#
# Boundaries are SYNTHETIC and say so; see ruakura-research-centre.toml. The
# AREA, though, is now sourced - see [boundary] - which matters more than the
# shape does, because everything the model computes per hectare scales with it.
#
# Not to be confused with the Lincoln University Dairy Farm (LUDF) on Ellesmere
# Junction Road, which is a different farm on a different road. LURDF is the
# research farm; LUDF is the demonstration farm.

[farm]
name = "lincoln_research_dairy_farm"
display_name = "Lincoln University Research Dairy Farm"
description = "Canterbury research dairy land on Weedons Road; the site the weather snapshot and the T3 growth reference both belong to."
region = "Canterbury"

[location]
# The LINZ-converted Canterbury Plains control point from
# tests/gis/ProjectionTest.cpp. It lies within a few kilometres of Lincoln, so
# it is the right place for solar geometry and the wrong place for a fence.
# location_verified is false accordingly. See docs/verify.md, open items 8 and 15.
centre_easting = 1557252.3158
centre_northing = 5167862.7895
latitude_degrees = -43.6410
location_verified = false
source = "LINZ Concord conversion of 172.470 E, 43.641 S (Canterbury Plains), via tests/gis/ProjectionTest.cpp. A regional point some kilometres from the farm, not a farm survey."

[boundary]
kind = "synthetic"
# The SHAPE is a placeholder rectangle. The AREA is not: Lincoln University
# gives LURDF as 72 ha irrigated, so the rectangle is sized to that rather than
# to a round number. 900 m x 800 m is 72.0 ha exactly.
#
# The earlier 1800 x 1400 was 252 ha, three and a half times the real farm, and
# every per-hectare figure computed on it was wrong in proportion.
extent_width_m = 900.0
extent_height_m = 800.0
area_hectares = 72.0
area_source = "Lincoln University, Research Dairy Farm page: LURDF is a 72 ha irrigated property on Weedons Road, Lincoln. https://www.lincoln.ac.nz/about-us/campus/lincoln-university-farms/research-farms/research-dairy-farm/"
paddock_hectares = 2.5
