# Where every livestock parameter in this project comes from.
#
# Each source below was fetched and read before anything was recorded against
# it. That matters more than it sounds: the brief this library was built from
# was accurate on almost everything, and wrong on one attribution that would
# have put a contested number into the model as settled fact. See the
# verification notes at the end of each entry, and docs/validation/verify.md.
#
# `retrieved` is the day the source was read. PDFs carry the SHA-256 of the file
# that was read, on the same principle the scenario bundles use: a citation is
# only traceable if the document it points into is the one somebody opened.

[source.dairynz_liveweight_targets]
organisation = "DairyNZ"
title = "Liveweight targets"
url = "https://www.dairynz.co.nz/animal/heifers/lw-targets/"
retrieved = "2026-08-18"
source_type = "primary"
verified = true
notes = """
Breed mature liveweight ranges for 6-8 year old cows, attributed on the page to
New Zealand Dairy Statistics (2024-25), and weight-for-age targets as a fraction
of mature weight.

Verified: all eight age anchors are on the page (3, 6, 9, 12, 15, 19, 22 months
and 6-8 years). A first reading returned only three of them; asking again by
name returned all eight with the kilogram table behind them, and the kilograms
are self-consistent with the percentages. Worth remembering that one summary of
a page is not a reading of it.
"""

[source.dairynz_weaning]
organisation = "DairyNZ"
title = "Weaning"
url = "https://www.dairynz.co.nz/animal/calves/weaning/"
retrieved = "2026-08-18"
source_type = "primary"
verified = true
notes = """
Commonly used weaning weights: Jersey 70 kg, Friesian x Jersey 80 kg, Friesian
90 kg.

Verified, including the caveat that matters more than the numbers: "Although no
specific weaning weight has been defined by research, the type of rearing system
will affect the target weaning weight." These are industry practice, not
research thresholds, and must not be recorded as the latter. The page gives no
weaning age.
"""

[source.dairynz_lactating_cow]
organisation = "DairyNZ"
title = "Lactating cow"
url = "https://www.dairynz.co.nz/animal/nutrition/lactating-cow/"
retrieved = "2026-08-18"
source_type = "primary"
verified = true
notes = """
Maintenance ME by liveweight, milksolids ME by diet and breed, pregnancy ME,
liveweight-change ME, and walking ME by contour.

Verified, and it is the strongest validation this project has for cattle: the
maintenance table is stated as calculated at 11.0 MJ ME/kg DM, and the equations
already implemented in core reproduce it to within 2% across 300-600 kg. See
docs/validation/verify.md.

The page also carries a walking ME table by contour - flat 2.0, rolling 3.0,
hilly/steep 6.0 MJ ME/km - which the brief did not mention and which is a New
Zealand alternative to the OVERSEER movement equations.
"""

[source.blnz_mating]
organisation = "Beef + Lamb New Zealand"
title = "Making every mating count"
url = "https://beeflambnz.com/sites/default/files/2026-06/Making-every-mating-count.pdf"
retrieved = "2026-08-18"
source_type = "primary"
verified = true
sha256 = "8cb91a0f69f0515a176d8348a6507bf4d1ae8760e33ba6347eda97617a5c39af"
notes = """
Appendix Three: feed requirements of sheep. Mature ewe maintenance and gain,
wether and ram lambs, ewe hoggets, lactation by litter size and week, and
pregnancy.

Verified point by point. Two things the brief omitted are in the source and are
recorded here: the lamb pasture requirement row of Appendix 3.4, and note (2),
"For triplets or quads add 1.0, 2.0 and 4.0 MJ ME/d for weeks 3, 6 and 9".

Its sheep tables follow Geenty and Rattray (1987), which Table 2.2 and Table 4.2
both say outright. That is a different framework from the Nicol and Brookes
tables in blnz_feed_planning, and the two differ by about 2 MJ/day at every
shared ewe weight. Neither corrects the other.

One correction to what was recorded here earlier: the pregnancy value at two
weeks before term is 3.8, not 0.8. The table appears twice in this document and
the appendix extraction lost a digit; the body table has it right, and the
series is monotonic after all.
"""

