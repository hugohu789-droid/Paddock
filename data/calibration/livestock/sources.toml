[source.tmc_me_review]
organisation = "AgResearch, for OVERSEER"
title = "Assessment of the OVERSEER metabolisable energy requirements model"
url = "https://assets.ctfassets.net/bo1h2c9cbxaf/1Tr5agQ07Dy6XGjn8OqD5H/fcd46d7888cd4f57b519a4fd71a48ed4/Metabolic_Energy_Requirements_Review_.pdf"
retrieved = "2026-08-18"
source_type = "review"
verified = true
sha256 = "2794cad8354ff94b8153cae26999d340472592b75a7911aab8f9bbf76c7961ae"
notes = """
Independent technical review of OVERSEER's ME model.

**Verified, and it corrects a mis-attribution.** The review quotes OVERSEER's
Equation 13 with base 0.28 and K of 1.4, 1.4, 1.0, 1.4, 1.7, 1.25 for dairy,
dairy replacements, sheep, beef, deer and dairy goats - and then recommends
changing two of them. Recommendation 6: "Modify the value of Kantype in the
BASAL equation to be 1.0 for sheep, 1.3 for British cattle breeds and 1.5 for
beef and dairy cattle of dairy origin."

So the K table is `direct` as a record of what OVERSEER uses, and must not be
recorded as a value this review endorses. The review also observes that
OVERSEER's equation "is cited as derived from Nicol and Brookes (2007), but uses
the K values" of a different source - which is the same disagreement already
recorded in docs/validation/verify.md, now with an independent reviewer taking a side.

Recommendation 9 gives a route for the cold-stress term this model lacks: CSIRO
(2007) equations, NIWA monthly climate, and Cottle and Pacheco (2016) for fleece
depth.

One detail the implementation does not yet capture: the review states lwt in
Equation 13 is "the live weight excluding conceptus and, for sheep, fleece".
"""

