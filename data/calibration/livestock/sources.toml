sha256 = "21cd4ac1b2c4020d70ee95e432000887688501497b163ef92dab074587f580ce"
notes = """
The second Beef + Lamb sheep feeding guide, and the one that resolved what
looked like a 26% hole in this project's maintenance model.

Verified. Its Appendix 1.2 gives 8.0 MJ ME/day for a 50 kg ewe at maintenance
and states "Source 1.2-1.6: A.M. Nicol and I.M. Brookes (2007) Pasture and
