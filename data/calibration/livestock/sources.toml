"""

[source.blnz_heifer_mating]
organisation = "Beef + Lamb New Zealand"
title = "Nutrition critical factor in heifer mating decision"
url = "https://beeflambnz.com/news/nutrition-critical-factor-heifer-mating-decision"
retrieved = "2026-08-18"
source_type = "primary"
verified = true
notes = """
"Replacement heifers should weigh at least 300kg LW or 60% of their mature cow
liveweight before mating at 15 months is considered."

Verified, and verified for what it does NOT say: the page gives no mature
liveweight for any beef breed. The 300 kg applies to Angus and Hereford, with
