retrieved = "2026-09-05"
source_type = "primary"
verified = false
notes = """
**New Zealand, the right breeds, and unreadable.** Indexed as reporting that
the lactation curves rise to a peak in the **second week** and then fall at a
constant rate to the twelfth, for ewes rearing single lambs.

Week 2 is inside the Beef + Lamb fact sheet's "two to four weeks" and at its
early edge, so the two New Zealand sources agree on the milk peak from
different decades.

Not verified: the publisher returned HTTP 403 to every route tried, and no open
mirror was found. **This entry records a lead, not a reading**, and nothing in
the model may be justified by it until somebody opens the paper. It is listed
against open item 13, which has the same problem for Geenty and Rattray (1987).
"""
