[source.adjabui_model_comparison]
organisation = "Massey University, published in Livestock Science"
title = "A comparison of three nutritional models for estimating total metabolisable energy requirements for a ewe, beef breeding cow, lamb, and a calf/yearling in New Zealand's pasture-only system"
authors = "Adjabui, J.A.; Morel, P.H.C.; Morris, S.T.; Kenyon, P.R.; Tozer, P.R."
citation = "Livestock Science 299 (2025) 105766"
retrieved = "2026-08-19"
source_type = "primary"
verified = true
notes = """
Read in full. It puts Nicol and Brookes (2017), CSIRO (2007) and New Zealand's
Agricultural Inventory Model (MPI 2022) through one stated set of assumptions,
which is the comparison this project could not make for itself.

It settles what open item 12 was blocked on. Their Eq. 2 writes the Nicol and
Brookes maintenance as the basal term over km PLUS MEgraze, MEmove and
MEactivity - the published figure is grazing-inclusive. This project had been
subtracting a bare basal term from it and reporting the difference as a
shortfall of 2% to 15%.

It also decides which figure to measure against. Their discussion records that
CSIRO accounts for chewing and ruminating inside km, that Nicol and Brookes add
those costs separately on top of the same km, and that AgResearch (2016) asked
the authors to correct the resulting double count. This model uses km the CSIRO
way, so CSIRO is the comparator and Nicol and Brookes is reported beside it.

Assumptions worth having, their Table 1: ewe 60 kg, four years, standard
reference weight 65 kg; beef cow 600 kg, six years, SRW 600 kg; pasture mass
3.5 t DM/ha; terrain 1.5; feed gross energy 18.45 MJ.

Daily maintenance, ewe neither pregnant nor lactating: CSIRO 9.0, Nicol and
Brookes 9.7, AIM 9.9 MJ ME/d. Annual totals for a 60 kg ewe: 3329, 3437, 3706.

Coefficients it states, which this project needed: the movement coefficient is
0.0025 for both Nicol and Brookes and CSIRO and 0.006 for AIM - so the 0.0025
carried here as a placeholder "the cattle figure carried across" is the right
number for sheep after all. The eating coefficient C differs: 0.02 for Nicol
and Brookes, 0.05 for AIM. Maximum stock density SD is 40 sheep or 5 cattle per
hectare, which makes their SR/SD a dimensionless ratio - worth checking against
how this project reads TSR/SD in TMC Eq. 21, where it passes hectares per
animal.

Two things it does NOT settle. It never mentions cold stress, so whether Ecold
sits inside the published maintenance is still unknown. And it does not cite
Geenty and Rattray (1987), so open item 13 gets nothing from it.

One incidental correction: its reference list carries BOTH a 2007 and a 2017
entry for the Nicol and Brookes chapter, same title, same pages 151-172, so
both printings exist and neither year is a mistake.

All three models use liveweight^0.75 in the basal term. That is what the
OVERSEER manual states and what this project follows; it is not evidence about
what OVERSEER itself computes, which is open item 14.
"""

[source.geenty_countrywide_feeding]
organisation = "Country-Wide (farming magazine)"
title = "Feeding options for sheep and cattle"
authors = "Geenty, K.G."
url = "https://country-wide.co.nz/feeding-options-for-sheep-and-cattle/"
retrieved = "2026-08-19"
source_type = "practitioner"
verified = true
notes = """
**Practitioner guidance, not research, and recorded as such.** A farming
magazine article giving feed allowances a farmer can act on.

It is here because of who wrote it: Ken Geenty is the Geenty of Geenty and
Rattray (1987), the paper open item 13 cannot obtain. He gives 12 MJ ME/day for
a 60 kg ewe at maintenance, against Nicol and Brookes' 9.7 and CSIRO's 9.0.
That 2.3 MJ is the same gap docs/validation/verify.md records for the 1987 paper - the
same author, thirty-eight years later, still about 2 MJ above.

What it suggests, and it is a suggestion rather than a finding: the Geenty
figure is a **feed allowance** rather than a physiological requirement -
what to hand out, including what the animal walks off, treads in and does not
eat. That would explain a difference that is systematic rather than noisy. It
does not establish it, because the article gives no breakdown, so open item 13
stays open.

Nothing in this project should take 12 MJ as a requirement. It is recorded so
the next person to reach open item 13 knows the gap is reproducible and knows
what to test for.
"""

[source.blnz_lactation_weaning]
organisation = "Beef + Lamb New Zealand"
title = "Fact Sheet 94: Lactation, lamb growth and the lamb weaning decision"
authors = "Beef + Lamb New Zealand, from an AgResearch report (2007)"
url = "https://beeflambnz.com/sites/default/files/factsheets/pdfs/fact-sheet-94-lactation-lamb-growth-and-the-weaning-decision.pdf"
retrieved = "2026-09-05"
sha256 = "90f71a042f8f2e2cde7f2dd7682917f0a65a75df58f52fe389a18d0d941ff674"
source_type = "practitioner"
verified = true
notes = """
**The New Zealand evidence E95 asked for, in extension form.** Dated August
2009 and stated on its own first page to rest on the Beef + Lamb New Zealand
"Weaning Decision" report prepared by AgResearch scientists in 2007. New
Zealand, pasture-grazed, dual-purpose ewes - it names Romney and crossbred
animals and gives 65 kg as a target mating weight, which is the animal the
shipped ewe is meant to be.

Two statements are why this file exists.

**Timing.** "Ewe intake increases two to three weeks into lactation and builds
to a peak at eight weeks. However milk production peaks at between two and four
weeks. The ewe simply can't eat enough to meet her lactation and energy
requirements." That is the phenomenon `FeedingConstraint::intake_capacity_limited`
represents, asserted for New Zealand ewes by a New Zealand source, and it also
dates both curves: milk at weeks 2-4, appetite at week 8.

**Magnitude.** "At peak lactation, single ewes consume around 2.5 kg DM/day and
twinning ewes 3 kg DM/day." Also, pre-weaning intake 2.07 kg DM/ewe falling to
0.92 kg at maintenance after weaning, and a 20% drop in intake at weaning.

**Recorded as practitioner, not primary, and the distinction is load-bearing.**
The 2007 AgResearch report behind it has not been read; these are round numbers
in a farmer fact sheet, not a measurement with a variance. They are strong
enough to bound a parameter and to say the model is high, and not strong enough
to set one. Same class as `geenty_countrywide_feeding`.

Verified: read from the PDF above, whose hash is recorded, not from a summary
of it.
"""

[source.vulich_litter_size_intake]
organisation = "Teagasc (Agriculture and Food Development Authority), Ireland"
title = "Effect of litter size on herbage intake at pasture by ewes and their progeny"
authors = "Vulich, S.A.; O'Riordan, E.G.; Hanrahan, J.P."
url = "https://www.cambridge.org/core/journals/animal-science/article/abs/effect-of-litter-size-on-herbage-intake-at-pasture-by-ewes-and-their-progeny/8B622CE10F1B5F30FE77FFE3B94A24F7"
retrieved = "2026-09-05"
source_type = "primary"
verified = false
notes = """
**Not New Zealand, and kept separate from the New Zealand figures for that
reason.** Animal Science 53(2):191. Ireland, perennial ryegrass pasture, 34
mature ewes - 17 rearing twins, 17 rearing singles.

It is here for one thing only: an independent, measured, temperate-pasture
confirmation that ewe intake peaks **late** in lactation. Intake reached its
maximum in weeks 6 to 7, with organic matter intake 2.50 kg/day for
twin-rearing ewes against 2.26 for single-rearing.

**Its numbers are not merged with the Beef + Lamb figures and must not be.**
Different country, different breed, different sward management, and organic
matter intake is not dry matter intake. It corroborates the *shape* of the
curve - a peak at weeks 6-7 rather than week 4 - and nothing else.

Not verified: only the abstract and indexing record were reachable; the full
paper is paywalled. Breed and ewe liveweight are therefore unrecorded, which is
a further reason not to use its magnitudes.
"""

[source.nzjar_1968_ewe_lactation]
organisation = "New Zealand Journal of Agricultural Research"
title = "Lactation performances of Romney, Corriedale and Merino ewes"
