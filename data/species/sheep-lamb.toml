# A lamb, from birth to sale.
#
# **The class the model kept talking about and did not have.** Lambs were born
# as a cohort of ewes: a newborn inherited a breeding ewe's 55 kg liveweight and
# her sex factor, which is why drafting on lamb liveweight sold animals whose
# weight the model never earned, and why the drafting rule had to be switched
# off. A lamb is a different animal from its mother and now says so.

[species]
name = "sheep_lamb"
kind = "sheep"
display_name = "Lamb"
description = "A lamb from birth to sale, on milk and grass before weaning and grass after it."

[energy]
# K, TMC Eq. 13. The same 1.0 as the ewe: CSIRO (2007) and Nicol and Brookes
# (2007) agree on sheep, and K is a species factor rather than a class one.
species_factor = { value = 1.0, status = "direct", source = "tmc_animal_me" }

# S, TMC Eq. 14 and section 5.2.4. **1.075, not 1.0**, and the reason is worth
# stating: the manual sets S to 1.075 for pre-weaned animals because they "are
# not sex segregated" - a lamb mob is ram and ewe lambs together, and the ram
# lambs cost more. A model that used the ewe's 1.0 here would underfeed every
# lamb on the farm by 7.5% of its basal requirement.
sex_factor = { value = 1.075, status = "direct", source = "tmc_animal_me" }

# SRW is the animal's MATURE weight, not its current one, so a lamb carries the
# same reference weight as the ewe it will become: TMC Characteristics of
# animals, Table 8, Romney 66 kg. It is what the energy value of gain is
# measured against (TMC Eq. 44-46), which is why a lamb lays down protein early
# and fat later.
standard_reference_weight_kg = { value = 66.0, status = "direct", source = "tmc_characteristics" }

# SpGraze, TMC Eq. 20. Carried across from the ewe, and inheriting her caveat:
# the manual gives 0.0025 for dairy and beef and states no sheep value in the
# chapter read.
grazing_coefficient = { value = 0.0025, status = "placeholder" }

# k1, TMC Eq. 44: 16.5 for large lean cattle breeds, 20.3 otherwise.
gain_energy_ceiling_mj_per_kg = { value = 20.3, status = "direct", source = "tmc_animal_me" }

[reproduction]
# A lamb does not breed, so it has no gestation and gives no milk - it only
# drinks it. Zero switches both terms off.
gestation_length_days = { value = 0.0, status = "direct", source = "tmc_animal_me" }
milk_fat_percent = { value = 0.0, status = "direct", source = "tmc_animal_me" }
milk_protein_percent = { value = 0.0, status = "direct", source = "tmc_animal_me" }
breed_effect = { value = 0.0, status = "direct", source = "tmc_animal_me" }

# **How long milk lasts.** TMC Eq. 16, from SCA (1994): "If it is assumed sheep
# can suckle up to 26 weeks, and cattle to 18 weeks". That makes the milk share
# of a lamb's diet 1 - age/182 - all milk on the day it is born, all grass at
# six months - and it is what keeps the farm from being fed twice, because the
# milk half is already charged to the ewe as lactation.
#
# A flock weaning at 103 days leaves its lambs on 43% milk the day they are
# weaned off it, which is the shape of a real weaning check.
suckling_weeks = { value = 26.0, status = "direct", source = "tmc_animal_me" }

[intake]
# **How big she ought to be for her age**, which is what GrazPlan scales
# appetite by rather than raw liveweight. Brody's curve for the ceiling, and a
# blend below it so that a ewe who has had a hard season carries a frame that
# went on growing while she did not - she comes out of it light rather than
# small, and can catch up.
#
#     Nmax = SRW - (SRW - Wbirth) * exp(-rate * age / SRW^exponent)
#     N    = blend * Nmax + (1 - blend) * W   when W is under the ceiling
#
# **DIRECT** - GrazPlan Eqs. 1 and 1a, `c-n-` for small ruminants in APSIM's
# Models/Resources/ruminant.prm: 0.0157, 0.27, 0.4. The same three appear in the
# technical paper's Table 1 as CN1, CN2 and CN3.
normal_weight_rate = { value = 0.0157, status = "direct", source = "grazplan_animal" }
normal_weight_exponent = { value = 0.27, status = "direct", source = "grazplan_animal" }
normal_weight_blend = { value = 0.4, status = "direct", source = "grazplan_animal" }

# **What a ewe in good condition does, which is not stop eating.** Past a
# relative condition of one her appetite falls away, and it keeps falling until
# what she eats is what holds her - so a well-fed ewe settles at a weight
# instead of growing without limit. Without it nothing in this model told a
# mature animal it was big enough.
#
#     CF = BC * (limit - BC) / (limit - 1)     for BC > 1 and not lactating
#
# **DIRECT** - GrazPlan Eq. 3, C_I20 from `c-i-` position 20 in ruminant.prm.
# The same 1.5 for sheep and for cattle.
condition_intake_limit = { value = 1.5, status = "direct", source = "grazplan_animal" }

# **And what a ewe in milk does, which is eat half again as much.** At peak she
# wants about 1.5 times a dry ewe's intake, and without that she is capped under
# her own requirement on every day she is milking - which is the whole reason
# intake capacity could not be wired into the farm before (verify.md, E71).
#
#     LF = 1 + peak * M^exponent * exp(exponent * (1 - M)),  M = days / peak_days
#
# **DIRECT** - GrazPlan Eq. 8. `c-i-` for small ruminants gives C_I8 = 28 days
# and C_I9 = 1.4; the four peaks are `c-imx-` for wool breeds, which is the set
# GrazPlan files the Romney under: 0.524, 0.524, 0.707, 0.891 for none, one, two
# and three lambs. Those are the technical paper's own sheep figures times the
# 0.8 its footnote applies to this group - 0.6553, 0.8843 and 1.1143 scale to
# 0.5242, 0.7074 and 0.8914, which is how the table was checked.
#
# **These name appetite, and only appetite** (verify.md, E110).
# `appetite_lactation_peak_days` is C_I8: the day the *appetite* increment
# peaks, because `M^exponent * exp(exponent * (1 - M))` is at its maximum where
# `M = 1`. **Milk timing is independent of every parameter in this file.** The
# yield curve is OVERSEER TMC Eq. 35, whose own fitted constants put its peak at
# `kMilkYieldPeakDays` - 0.41/0.0287, about 14.29 days - and nothing here can
# move it. These carried the prefix-free name until E110; it had misread as a
# statement about milk twice without ever producing a wrong number.
#
# **Eq. 8's LA and LB are not here**: condition at parturition and weight lost
# since it, both needing a history this model does not keep. Both are at most
# one, so leaving them out makes her hungrier than GrazPlan would, never less.
appetite_lactation_peak_days = { value = 28.0, status = "direct", source = "grazplan_animal" }
appetite_lactation_curve_exponent = { value = 1.4, status = "direct", source = "grazplan_animal" }
appetite_lactation_peak_no_young = { value = 0.524, status = "direct", source = "grazplan_animal" }
appetite_lactation_peak_one_young = { value = 0.524, status = "direct", source = "grazplan_animal" }
appetite_lactation_peak_two_young = { value = 0.707, status = "direct", source = "grazplan_animal" }
appetite_lactation_peak_three_young = { value = 0.891, status = "direct", source = "grazplan_animal" }

# **Appetite: what she would eat if nothing stopped her.** Everything in
# [energy] says what a ewe needs; this says what she wants, and the gap between
# them is what lets a mob lose a quarter of its grazing efficiency on a short
# paddock and still walk away fed. GrazPlan Eq. 2, without the four factors this
# model has no state for - condition, rumen development, heat and lactation.
#
#     Imax = scalar * SRW * Z * (size_coefficient - Z),  Z = liveweight / SRW
#
# At this ewe's 66 kg reference weight and full size that is 1.85 kg DM a day,
# against a maintenance requirement nearer 1.0.
#
# **The size coefficient is checked twice**, because the paper's table does not
# survive text extraction with its columns aligned: the text says the quadratic
# peaks at a relative size of 0.85, and 1.7 is the only value for which it does.
# Fig. 2 then draws a 50 kg sheep peaking near 1.44 kg DM a day, which the same
# two numbers reproduce.
# **Enabled, and the value is GrazPlan's own.** Three sources agree on 0.04:
# the paragraph above, Fig. 2's 50 kg sheep peaking near 1.44 kg DM a day, and
# APSIM's `ruminant.prm`, whose C_I1 this project's source record notes as
# confirming "every coefficient this project had already inferred from the
# paper's figures rather than its table". That confirmation is the file's
# generic one - the breed grouping `c-imx-` is named only for the lactation
# peaks - so this is a sheep coefficient and not a Romney one, and it can be
# enabled without waiting on the breed question.
#
# **It was written here as 0.0 for as long as the parameter existed**, which
# switched the whole intake ceiling off for every sheep in the project: callers
# fall back to the animal's energy requirement when this is not positive, so it
# failed silently and exactly as designed to. E93 found it; E103 to E106
# cleared the three management defects that made switching it on look like a
# biological problem - a cumulative counter read as consecutive, a floor
# counting lambs, and one field meaning both "no feed" and "no appetite".
#
# **What is still open is magnitude, not direction.** This ewe carries
# OVERSEER's 66 kg New Zealand dual-purpose reference weight beside GrazPlan's
# Australian wool-breed lactation peaks, and the milk-demand curve peaks a
# fortnight before the appetite curve. The lag is ordinary early-lactation
# physiology; how deep it should be for this animal is not settled, so every
# animal-production figure that turns on it is reported as exploratory until
# E95 closes. See E107.
appetite_scalar_per_day = { value = 0.04, status = "direct", source = "grazplan_animal" }
appetite_size_coefficient = { value = 1.7, status = "direct", source = "grazplan_animal" }

# **How much of what it needs a sheep can actually get off a short paddock.**
#
# Everything in [energy] answers "what does this ewe need". This answers the
# other half, and until it existed the model had no answer: a mob ate its full
# requirement unless the paddock physically ran out above the residual. That is
# a cliff, and grazing is a curve. Two irrigation arms differing by 5,290 kg
# DM/ha of growth ate five kilograms apart (verify.md, E52).
#
# A shorter sward means a smaller bite. The animal grazes longer to compensate -
# up to 1.6 times as long on a bare paddock - and past a point cannot compensate
# at all:
#
#     rate = 1 - exp(-availability_rate * B)
#     time = 1 + increase * exp(-(grazing_time_rate * B)^2)
#     relative intake = rate * time
#
# where B is standing herbage in kg DM/ha, green and dead together, cut close to
# ground level - which is how these coefficients are defined and therefore not
# the same as the green above the grazing residual.
#
# **DIRECT** - GrazPlan equations 16 and 17 with the sheep column of its Table
# 2. Freer M, Moore A D & Donnelly J R, "The GRAZPLAN animal biology model for
# sheep and cattle and the GrazFeed decision support tool", CSIRO Plant Industry
# Technical Paper. The functional form is from Allden and Whittaker (1970).
# CSIRO (2007) is already one of the two primaries behind the species factor
# above, so this is the same lineage rather than a second opinion.
#
# **Not yet grazed through, and E71 says why.** These multiply the appetite
# above, never a requirement - the term is below one at any cover a real farm
# carries, so against a requirement it puts every mob permanently short. Against
# the appetite it bites only below about 800 kg DM/ha, which is the right
# answer for a dry animal and the wrong one for a milking one: GrazPlan lifts
# potential intake during lactation through a factor this model cannot yet
# compute, so a ewe with a lamb at foot would be capped under what she needs.
availability_rate_per_kg_dm = { value = 0.00112, status = "direct", source = "grazplan_animal" }
grazing_time_increase = { value = 0.6, status = "direct", source = "grazplan_animal" }
grazing_time_rate_per_kg_dm = { value = 0.00112, status = "direct", source = "grazplan_animal" }

[typical]
# A lamb at about a month old: past its birth weight, well short of drafting.
liveweight_kg = 15.0
age_days = 30.0

# **Not rated, deliberately.** Parker's Table 1 has no line for a lamb at foot,
# because a stock unit is a ewe *and* the lamb she rears - counting the lamb
# again would carry it twice. A weaned lamb being finished is a different class
# and would want its own figure; this file is the lamb on the mother.
#
# Zero means "no published conversion", and a farm carrying this class reports
# no stocking rate for it rather than a made-up one.
stock_units = 0.0
