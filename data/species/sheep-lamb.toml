# A weaned lamb.
#
# This class is the one the model can be checked against: Frater, Howarth and
# McEwen give a worked lamb of 28 kg gaining 100 g/day at 100 days old on a
# 10.5 MJ ME/kg DM diet, needing 9.72 MJ ME/day by Nicol and Brookes (2007).
# tests/unit/AnimalEnergyTest.cpp reproduces it. See docs/verify.md.

[species]
name = "sheep_lamb_weaned"

# What a person would call it, for anything that has to show this animal
# rather than compute with it. The energy model works from the factors below and
# does not read this; a map that cannot say whether those are sheep or cattle is
# withholding the one thing a reader could see for themselves.
kind = "sheep"
display_name = "Weaned lamb"
description = "A growing lamb after weaning; the class with a published worked example behind it."

[energy]
# K, TMC Eq. 13. CSIRO (2007) and Nicol and Brookes (2007) both give 1.0 for
# sheep - the one species factor the two sources agree on, and the one the
# OVERSEER ME review leaves alone in its Recommendation 6.
species_factor = { value = 1.0, status = "direct", source = "tmc_animal_me" }

# S, TMC Eq. 14: 1.075 for a mixed-sex mob, which is what a
# weaned lamb crop is before the wether lambs are drafted off.
sex_factor = { value = 1.075, status = "direct", source = "tmc_animal_me" }

# SRW. No source: the OVERSEER chapter that carries breed characteristics has
# not been retrieved, and Beef + Lamb NZ's feeding tables give liveweight
# classes rather than breed mature weights - which their own guidance says must
# not be read as one. SRW drives the energy value of gain (TMC Eq. 45), so a
# growth rate resting on this number is not quotable.
standard_reference_weight_kg = { value = 65.0, status = "verify" }

# SpGraze, TMC Eq. 20. The manual gives 0.0025 for dairy and beef and states no
# sheep value in the chapter read, so this is the cattle figure carried across.
grazing_coefficient = { value = 0.0025, status = "placeholder" }

# k1, TMC Eq. 44: 16.5 for large lean cattle breeds, 20.3 otherwise.
gain_energy_ceiling_mj_per_kg = { value = 20.3, status = "direct", source = "tmc_animal_me" }

[typical]
liveweight_kg = 28.0
age_days = 100.0
