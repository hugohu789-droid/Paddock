# A DRY dairy cow - and the word is load-bearing.
#
# Lactation (TMC Eq. 33-35) is not implemented, so this model has no way to
# represent a cow in milk. A cow defined here eats roughly what an animal at
# maintenance eats and about half what a milking one would. Naming the file for
# what it actually models is the difference between a limitation and a wrong
# answer nobody noticed. See docs/validation/verify.md.

[species]
name = "cattle_dairy_dry"

# What a person would call it, for anything that has to show this animal
# rather than compute with it. The energy model works from the factors below and
# does not read this; a map that cannot say whether those are sheep or cattle is
# withholding the one thing a reader could see for themselves.
kind = "cattle"
display_name = "Dry dairy cow"
description = "A non-lactating dairy cow. Lactation is not modelled; this is not a milking cow."

[energy]
# K, TMC Eq. 13, and the one number here where the sources disagree. OVERSEER
# uses CSIRO (2007)'s 1.4 for dairy cattle. Nicol and Brookes (2007) give 1.5,
# and the independent OVERSEER ME review sides with them: its Recommendation 6
# is to "modify the value of Kantype in the BASAL equation to be 1.0 for sheep,
# 1.3 for British cattle breeds and 1.5 for beef and dairy cattle of dairy
# origin". This file records what OVERSEER does, which is what the rest of the
# implemented equation set assumes; the disagreement is in docs/validation/verify.md, and
# changing it is a decision, not a correction.
species_factor = { value = 1.4, status = "direct", source = "tmc_animal_me" }

# S, TMC Eq. 14: females.
sex_factor = { value = 1.0, status = "direct", source = "tmc_animal_me" }

# SRW. DairyNZ publish mature liveweight ranges by breed - Jersey 441-453,
# crossbred 522-533, Friesian 567-580 kg for 6-8 year old cows - but this
# definition is not tied to a breed, so a midpoint of one of them would be a
# choice dressed as a citation. Left to verify until the file names a breed.
standard_reference_weight_kg = { value = 500.0, status = "verify" }

# SpGraze, TMC Eq. 20: 0.0025 for dairy and beef. This one the manual states.
grazing_coefficient = { value = 0.0025, status = "direct", source = "tmc_animal_me" }

# k1, TMC Eq. 44: 16.5 for large lean cattle breeds.
gain_energy_ceiling_mj_per_kg = { value = 16.5, status = "direct", source = "tmc_animal_me" }

[intake]
# **Appetite: what she would eat if nothing stopped her.** Everything in
# [energy] says what a cow needs; this says what she wants, and the gap between
# them is what lets a mob lose a quarter of its grazing efficiency on a short
# paddock and still walk away fed. GrazPlan Eq. 2, without the four factors this
# model has no state for - condition, rumen development, heat and lactation.
#
#     Imax = scalar * SRW * Z * (size_coefficient - Z),  Z = liveweight / SRW
#
# The cattle column of the same table; a cow's scalar is lower and her
# reference weight far higher, so her appetite is much the larger of the two.
#
# **The size coefficient is checked twice**, because the paper's table does not
# survive text extraction with its columns aligned: the text says the quadratic
# peaks at a relative size of 0.85, and 1.7 is the only value for which it does.
# Fig. 2 then draws a 50 kg sheep peaking near 1.44 kg DM a day, which the same
# two numbers reproduce.
appetite_scalar_per_day = { value = 0.025, status = "direct", source = "grazplan_animal" }
appetite_size_coefficient = { value = 1.7, status = "direct", source = "grazplan_animal" }

# **How much of what it needs a cow can actually get off a short paddock.**
#
# Everything in [energy] answers "what does this ewe need". This answers the
# other half, and until it existed the model had no answer: a mob ate its full
# requirement unless the paddock physically ran out above the residual. That is
# a cliff, and grazing is a curve. Two irrigation arms differing by 5,290 kg
# DM/ha of growth ate five kilograms apart (verify.md, E52).
#
# A shorter sward means a smaller bite. The animal grazes longer to compensate -
# up to 1.6 times as long on a bare paddock - and past a point cannot compensate
# at all:
#
#     rate = 1 - exp(-availability_rate * B)
#     time = 1 + increase * exp(-(grazing_time_rate * B)^2)
#     relative intake = rate * time
#
# where B is standing herbage in kg DM/ha, green and dead together, cut close to
# ground level - which is how these coefficients are defined and therefore not
# the same as the green above the grazing residual.
#
# **DIRECT** - GrazPlan equations 16 and 17 with the sheep column of its Table
# 2 - the cattle column here, which differs from the sheep one. Freer M, Moore A D & Donnelly J R, "The GRAZPLAN animal biology model for
# sheep and cattle and the GrazFeed decision support tool", CSIRO Plant Industry
# Technical Paper. The functional form is from Allden and Whittaker (1970).
# CSIRO (2007) is already one of the two primaries behind the species factor
# above, so this is the same lineage rather than a second opinion.
#
# **Not yet grazed through, and E71 says why.** These multiply the appetite
# above, never a requirement - the term is below one at any cover a real farm
# carries, so against a requirement it puts every mob permanently short. Against
# the appetite it bites only below about 800 kg DM/ha, which is the right
# answer for a dry animal and the wrong one for a milking one: GrazPlan lifts
# potential intake during lactation through a factor this model cannot yet
# compute, so a ewe with a lamb at foot would be capped under what she needs.
availability_rate_per_kg_dm = { value = 0.00078, status = "direct", source = "grazplan_animal" }
grazing_time_increase = { value = 0.6, status = "direct", source = "grazplan_animal" }
grazing_time_rate_per_kg_dm = { value = 0.00074, status = "direct", source = "grazplan_animal" }

[typical]
liveweight_kg = 480.0
age_days = 1500.0

# **Not rated yet.** Parker's Table 1 gives beef cows 5.5 to 6.0 and dairy cows
# 5.1 to 8.5 depending on the source, which is too wide a spread to pick from
# without knowing which kind of cow this file is meant to be - and it is a "dry
# cow", which is not a class any of those tables lists. Left at zero rather than
# guessed; a farm carrying it will decline to report a stocking rate and say so.
stock_units = 0.0
