# A mature breeding ewe.
#
# Sheep are the one class where the two primary sources agree on the species
# factor, so this file has no choice to record. What it does have is an
# unverified standard reference weight - see the note below and open item in
# docs/validation/verify.md.

[species]
name = "sheep_ewe"

# What a person would call it, for anything that has to show this animal
# rather than compute with it. The energy model works from the factors below and
# does not read this; a map that cannot say whether those are sheep or cattle is
# withholding the one thing a reader could see for themselves.
kind = "sheep"
display_name = "Breeding ewe"
description = "A mature ewe at maintenance; the major grazing mob on a breeding property."

[energy]
# K, TMC Eq. 13. CSIRO (2007) and Nicol and Brookes (2007) both give 1.0 for
# sheep - the one species factor the two sources agree on, and the one the
# OVERSEER ME review leaves alone in its Recommendation 6.
species_factor = { value = 1.0, status = "direct", source = "tmc_animal_me" }

# S, TMC Eq. 14: 1.0 for females and castrated males.
sex_factor = { value = 1.0, status = "direct", source = "tmc_animal_me" }

# SRW. **Sourced at last.** This said 65.0 and "verify", because the OVERSEER
# chapter carrying breed characteristics had not been retrieved. It has now:
# TMC Characteristics of animals, Table 8, "Female standard reference weight
# (SRWf, kg) for sheep breeds", gives Romney 66. A kilogram is a small change
# and the reason for making it is not: this number drives the energy value of
# gain (TMC Eq. 45) and, now, lamb birth weight and the pregnancy condition
# factor, so it was worth having from the source rather than from nowhere.
standard_reference_weight_kg = { value = 66.0, status = "direct", source = "tmc_characteristics" }

# SpGraze, TMC Eq. 20. The manual gives 0.0025 for dairy and beef and states no
# sheep value in the chapter read, so this is the cattle figure carried across.
grazing_coefficient = { value = 0.0025, status = "placeholder" }

# k1, TMC Eq. 44: 16.5 for large lean cattle breeds, 20.3 otherwise.
gain_energy_ceiling_mj_per_kg = { value = 20.3, status = "direct", source = "tmc_animal_me" }

# What it costs to carry a lamb and to milk one. A file without this table is a
# class that does not breed.
[reproduction]
# GL, TMC Characteristics of animals Table 28, from Freer et al. (2006).
gestation_length_days = { value = 150.0, status = "direct", source = "tmc_characteristics" }

# Cmilkfat and Cmilkprotein, the percentages TMC Eq. 46 turns into the energy in
# a kilogram of milk.
#
# **The manual's own cross-reference is broken here** - Eq. 46 sends the reader
# to section 5.8 for these, and 5.8 is about the monthly distribution of milk
# yield. So they come from the literature instead. Protein is the 5.8% commonly
# reported for sheep. Fat is the weaker of the two: published values run from
# 4.6% in Iraqi Kurdi to 12.6% in Dorset ewes, no New Zealand Romney figure has
# been read, and 7.0 is mid-range. Milk energy moves about 0.38 MJ/kg per point
# of fat, so this is worth verifying before a lactation result is quoted.
# docs/validation/verify.md, E23.
milk_fat_percent = { value = 7.0, status = "verify" }
milk_protein_percent = { value = 5.8, status = "verify" }

# Breedeffect, TMC Eq. 38: 0.2 East Friesian, 0.1 Romney/East Friesian cross,
# 0.01 otherwise. A straight Romney takes the "otherwise" branch.
breed_effect = { value = 0.01, status = "direct", source = "tmc_animal_me" }

[typical]
liveweight_kg = 60.0
age_days = 1200.0

# **What a head of this class counts as, in the unit New Zealand farms are
# compared in.** Parker (1998) Table 1 collects the published conversions and a
# breeding ewe is 1.0 in the New Zealand Meat and Wool Board's Economic Service
# figures - the survey that became Beef + Lamb's - and 1.0 in MAF's. Coop gives
# 0.8 to 1.1, Lincoln 0.65 to 1.45; the spread is ewe weight and prolificacy,
# and this class is Parker's base ewe at 55 kg weaning one lamb.
#
# See data/calibration/stock-unit-intake.csv, and E53 for what happened when
# this repository asserted 1.35 instead in order to make a farm match its class.
stock_units = 1.0
