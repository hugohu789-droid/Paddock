# A grazed year: the first bundle in which anything eats.
#
# canterbury-baseline models pasture alone, which is what every bundle written
# before livestock existed does. This one carries stock and says how they are
# managed, so a run of it exercises the whole loop - pasture grows, a mob eats,
# being underfed costs it weight, the farmer moves it, the paddock rests.
#
# The weather, soil and sward are still PLACEHOLDER definitions (see
# docs/validation/verify.md), so this bundle demonstrates that the loop closes and is
# stable. It is not a description of Canterbury, and no number out of it is a
# prediction. The ground is the exception: see [terrain].

[scenario]
name = "canterbury_grazed"
description = "One year of synthetic weather on a subdivided block, with ewes on it."
engine_version = "0.1.0"
master_seed = 20240702

[run]
# The New Zealand farm year, 1 July to 30 June.
start_date = "2023-07-01"
end_date = "2024-06-30"
latitude_degrees = -43.5

[weather]
# **Real weather, on the ground this bundle already stood on.** These two
# Canterbury bundles used to run a synthetic generator whose own file said its
# parameters "have not been taken from NIWA's published normals for any" site -
# and it drew 721 and 926 mm against a Lincoln normal near 630, so the farm they
# described was wetter than Canterbury and grew accordingly (verify.md, E79).
#
# Fetched for the Selwyn plains, which is where this bundle's LiDAR tile is:
#
#   scripts/open-meteo-snapshot.py --lon 172.40 --lat -43.50 \
#       --start 2000-07-01 --end 2025-06-30 --no-uv \
#       --out data/scenarios/canterbury-grazed/weather-2000-2025.csv
#
# Twenty-five years, because the seasonal validation runs two decades against
# DairyNZ's curves and a generator could produce any dates where a snapshot
# cannot. The archive answered for -43.47979, 172.43242 at 85 m. No ultraviolet: the
# CAMS archive does not reach back to 2015, and a gap is refused rather than
# filled - see the provenance file beside this one.
#
# **Both Canterbury bundles read the same file on purpose.** They differ in
# whether the farm is grazed, so sharing the weather makes them a comparison
# rather than two unrelated runs.
kind = "snapshot"
path = "weather-2000-2025.csv"
sha256 = "284f89f66b135c1adc8ccd445a02f14ef7c2d25656dcd8607cc93fb40110cb9c"
dataset = "Open-Meteo historical weather API (ERA5 reanalysis)"
licence = "CC-BY-4.0. Weather data by Open-Meteo.com, licensed under CC BY 4.0. Generated using Copernicus Climate Change Service information (ERA5)."

[soil]
path = "soil.toml"
sha256 = "523e37beed50db5ecb6c367a5d53cf578823561dc940fbbc6aef31facdc4a36a"

[sward]
path = "../../pastures/ryegrass-clover-nz.toml"
sha256 = "65537a82bdd7de1a84a3adcc3f8a173cef84c943a94f3cf0354746b943c57d5a"

# **What this farm is priced by and measured against.**
#
# Named here rather than assumed, because there is no national answer to either.
# New Zealand's nitrogen loss limits are set by regional councils catchment by
# catchment, and Beef + Lamb's cost survey is published by farm class and island.
# The window used to reach for these two files whatever bundle was open, which
# put a Waikato block under the Canterbury Land and Water Regional Plan. See
# docs/validation/verify.md, E57.
#
# A bundle that names neither still runs; it reports what leached and has
# nothing to say about compliance, and it keeps no books.
[economics]
path = "../../economics/canterbury-sheep.toml"
sha256 = "8b6b680b8855894642fc75c493c761b694519c9959d124d303f827a2b1a726ae"

[regulation]
path = "../../regulations/canterbury-nitrogen.toml"
sha256 = "31c097d904bf9d1fee40e75a83501d0608be58eea61a44e70fe41ce7f33fa3aa"

[initial_state]
soil_water_mm = 90.0
grass_kg_dm_per_ha = 2200.0
legume_kg_dm_per_ha = 600.0
soil_mineral_nitrogen_kg_per_ha = 60.0

# **Where this block is, and why there.** The origin used to be 1570000 E,
# 5180000 N - round numbers, chosen as a plausible-looking Canterbury
# coordinate and never checked. Converted, they land on central Christchurch:
# every LINZ elevation collection covering that point is named "Christchurch".
#
# It now sits on the same farmland as canterbury-baseline, chosen from the LINZ
# primary parcels in data/snapshots/lincoln-parcels.geojson rather than from a
# look at a map: 93.8% of points sampled across it fall inside parcels larger
# than 10 ha, and only 14 parcels touch it, one of them under half a hectare.
# Three of the holdings under it are Rural Sections. See
# data/scenarios/canterbury-baseline/scenario.toml for the whole reasoning.
#
# The ground is measured. The weather is still synthetic and the soils are
# still a placeholder gradient.
[grid]
# 48 x 32 cells at 25 m is 96 hectares.
cols = 48
rows = 32
cell_size_m = 25.0
# Centred on the 120 mm this bundle's soil.toml computes, not replacing it: the
# grid used to override the soil file outright, so a stated profile of 120 mm
# ran on a farm averaging 100. The bundle now refuses when the two disagree.
# The +-20 mm spread is PLACEHOLDER; the centre comes from the soil file.
available_water_west_mm = 100.0
available_water_east_mm = 140.0
origin_easting = 1554550.0
origin_northing = 5167300.0

# Subdividing 96 ha at 2 ha gives 40 paddocks of 2.4 ha, not 48 of 2.0. The
# generator fits as many WHOLE paddocks of the target size as the block takes -
# 8 across and 5 down at 141 m square - and then divides the block exactly among
# them, so they tile it with no gap and come out a little larger than asked. A
# gap would be a cell no paddock owns, which is a cell that is silently never
# grazed, and that is the worse failure of the two.
#
# 40 is still enough to hold a 35 day spell on a three day graze. A block cut
# into four could not, and the farmer would report the shuffle rather than the
# rotation - see tests/unit/FarmerTest.cpp.
paddock_hectares = 2.0

# The stock. A species is referenced the way every other input is, by relative
# path with its hash recorded, so the bundle stays reproducible without copying
# data/species/ into it.
[[mob]]
name = "main mob"
path = "../../species/sheep-ewe.toml"
sha256 = "a6706f76ee40b7c0e9f1f3f947258229cc9342ef409701b1182a6661c6d59103"
head = 500
paddock = 0
# The species file describes a typical 60 kg ewe; this run starts with lighter
# ones, which is a different farm and is meant to be.
#
# 500 ewes on 96 hectares is 5.2 a hectare, and the figure was chosen by running
# the model rather than asserted: at 500 the mob holds its weight and never goes
# short, and at 700 it starts losing condition and runs out of feed on four days.
# That is a carrying capacity this model reports, not one taken from anywhere -
# with placeholder pasture parameters underneath it, so it is a demonstration
# that the loop settles, not advice about a real farm.
liveweight_kg = 55.0
age_days = 1500.0

# How they are managed, through the year. The shape follows Smith and Dawson
# (1976): set stocked over lambing, rotating the rest of the year, at 21 days
# after weaning and 35 as the summer dries. See docs/validation/verify.md.
#
# The same system appears more than once with different parameters, which is
# the point of a calendar rather than a single setting.

[[grazing_period]]
name = "winter rotation"
from = "2023-07-01"
to = "2023-08-19"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 35

[[grazing_period]]
name = "lambing"
from = "2023-08-20"
to = "2023-10-28"
system = "set_stocking"

[[grazing_period]]
name = "post-weaning rotation"
from = "2023-10-29"
to = "2023-11-30"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 21

[[grazing_period]]
name = "dry season rotation"
from = "2023-12-01"
to = "2024-06-30"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 35

# What the farmer will not allow, and what they may do about it.
#
# The calendar above says which system applies when. This says what the farmer
# is holding to while running it, and the two are not alternatives: a calendar
# without a policy leaves the most consequential judgement - whether to graze
# the sward out or buy feed - to whatever code happened to start the run.
#
# These are the values tests/validation/ManagedFarmTest.cpp exercises the model
# at, which is the only reason to prefer them to any other round number: they
# are the ones the loop is known to settle under.
[management]
minimum_cover_kg_dm_per_ha = 1600.0
rotation_cover_threshold_kg_dm_per_ha = 2200.0
target_liveweight_gain_kg_per_day = 0.0
maximum_graze_days = 3
minimum_spell_days = 35
supplement_me_mj_per_kg_dm = 10.0
may_buy_feed = true

[terrain]
# Measured ground, shared with data/scenarios/lincoln-lurdf and
# data/scenarios/canterbury-baseline.
#
# One LiDAR tile covers all three farms, so all three bundles pin the same file
# and the same hash. Fetching it once is enough:
#
#   scripts/nz-elevation-snapshot.py --lon 172.44386 --lat -43.64954 \
#       --collection canterbury/selwyn_2023 \
#       --out data/snapshots/lincoln-dem-1m.tiff
#
# Canterbury - Selwyn LiDAR 1m DEM (2023), tile BX23_10000_0404, flown 23 March
# to 3 May 2023, 1 m, already in NZTM2000. Licensed CC BY 4.0, licensor
# Environment Canterbury, produced by Landpro, hosted and processed by Toitu Te
# Whenua LINZ. A DEM and not a DSM: bare earth, because grass grows on the
# ground and not on the woolshed roof.
#
# The file is not committed - snapshots never are - and the hash is what makes
# that safe.
kind = "snapshot"
path = "../../snapshots/lincoln-dem-1m.tiff"
sha256 = "2f635bb0cc1097d434ff496a71c3c3372d9e9edfce730ce4f2630ee6bde849c0"

# **Where it comes from, so the ground is a download rather than an errand.**
# The hash above already says which file this scenario means; the address below
# says where that exact file is published, and together they are enough for
# `paddock ground fetch` to put it on this machine without anybody searching a
# catalogue for it. Finding which tile covers a *new* farm is the harder job and
# stays in scripts/nz-elevation-snapshot.py, where it belongs - it is something
# you do once, when you decide where the farm is.
#
# No account and no key. LINZ publishes elevation as open data on S3; it is the
# Data Service, which serves the cadastre, that wants an API key.
#
# The attribution is written here rather than read out of the download, because
# a credit that only exists once somebody has successfully fetched something is
# not a credit. It ships in the archive whether or not the file ever arrives.
url = "https://nz-elevation.s3-ap-southeast-2.amazonaws.com/canterbury/selwyn_2023/dem_1m/2193/BX23_10000_0404.tiff"
attribution = "Canterbury - Selwyn LiDAR 1m DEM (2023). Sourced from LINZ elevation open data (https://nz-elevation.s3-ap-southeast-2.amazonaws.com) and licensed for re-use under CC-BY-4.0."
