# An example synthetic weather site, shaped like the Canterbury Plains.
#
# Every climate normal here is PLACEHOLDER. They give a Southern Hemisphere year
# of about the right amplitude - warm dry summers, cold winters, moderate
# rainfall - but they have not been taken from NIWA's published normals for any
# station. A run driven by this file is a demonstration, not a simulation of a
# place.
#
# PLACEHOLDER - verify against NIWA climate normals (docs/validation/verify.md, item 7).
# For a real site, replay a CliFlo snapshot instead: see
# scripts/cliflo-snapshot.py and ADR 0008.

[site]
name = "canterbury_plains_example"
licence = "example data, not derived from any published dataset"
latitude_degrees = -43.5

[variation]
daily_temperature_sd_c = 2.0            # PLACEHOLDER
radiation_variation_fraction = 0.1      # PLACEHOLDER
wet_day_radiation_fraction = 0.5        # PLACEHOLDER - cloud effect on wet days
wind_variation_fraction = 0.2           # PLACEHOLDER

# Twelve months, January first. All PLACEHOLDER.

[[month]]  # January
mean_daily_max_c = 22.5
mean_daily_min_c = 12.0
wet_day_probability = 0.20
mean_wet_day_rainfall_mm = 8.0
rainfall_shape = 0.8
mean_solar_radiation_mj = 24.0
mean_wind_speed_m_per_s = 3.2

