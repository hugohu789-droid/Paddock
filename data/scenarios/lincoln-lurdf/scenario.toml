# Lincoln University Research Dairy Farm, on the ground it actually sits on.
#
# The first bundle in this project whose terrain is measured rather than
# generated. Everything else in it is still the placeholder set the Canterbury
# examples use - the weather, the soil and the sward files are byte for byte the
# ones canterbury-grazed carries, and hash to the same values - so what this
# bundle demonstrates is the terrain path and nothing more. It is not a
# description of how LURDF farms.
#
# **The ground is real and nearly flat, and both halves of that matter.** Over
# the whole 4.8 by 7.2 km LiDAR tile the elevation runs from 0.4 m to 26.1 m
# above sea level, mean 7.0 m; over these 80 hectares it moves by a couple of
# metres. Drawn true to scale the farm looks flat because it is flat: this is
# the Canterbury Plains. A viewer wanting to see the shape of it has to
# exaggerate the heights, and the view says by how much when it does.
#
# The boundary is still the placeholder rectangle from
# data/farms/lincoln-research-farms.toml - the right AREA in the wrong SHAPE,
# because LINZ's open cadastre carries no owner and nothing yet says which
# parcels are the farm. See docs/validation/verify.md, open item 15.

[scenario]
name = "lincoln_lurdf"
description = "LURDF's 79 hectares on measured LiDAR ground, with placeholder weather, soil and sward."
engine_version = "0.1.0"
master_seed = 20230323

[run]
# The New Zealand farm year, 1 July to 30 June.
start_date = "2023-07-01"
end_date = "2024-06-30"
latitude_degrees = -43.641

[weather]
# The weather that actually happened over this farm year, not a generator.
#
# 1 July 2023 to 30 June 2024, the run's own dates, fetched with
#
#   scripts/open-meteo-snapshot.py --lon 172.44386 --lat -43.64954 \
#       --start 2023-07-01 --end 2024-06-30 \
#       --out data/scenarios/lincoln-lurdf/weather-2023.csv
#
# **Committed, unlike the elevation.** data/snapshots/ is gitignored because
# bulk datasets are not committed and because NIWA's terms forbid passing their
# data on. Neither applies here: this is 13 kB, and Open-Meteo is CC BY 4.0,
# which permits redistribution. So it lives with the bundle like weather.toml
# did, and a fresh clone runs this farm on the weather it really had.
#
# **Reanalysis, not observation.** ERA5 is a model's estimate of the weather,
# on a grid cell tens of kilometres across - it answered for -43.6204,
# 172.4096 at 15 m, about 4 km from the farm. It is the right source for a farm
# with no station on it, and the wrong one for checking a station that has one.
# The full record is in weather-2023.csv.provenance.json.
#
# What it looks like, against Lincoln's published normals: 652 mm of rain over
# the year against a normal near 630, a mean of 12.2 C against about 11.5, and
# January at 18.3 C against July at 7.5. The strongest check is physical - the
# highest clearness index Rs/Ra in the year is 0.75, the textbook clear-sky
# value, and never above 1.0, so the series never reports more sun than the sky
# at this latitude can deliver.
#
# **Two models in one file.** Everything but the ultraviolet is ERA5, from the
# archive endpoint. The archive carries no ultraviolet at all - asking it
# returns a column of nulls - so `uv_index` comes from the air quality endpoint,
# which is CAMS: a different reanalysis by a different group. The provenance
# file names which column came from which, and a run should not treat the two
# as one measurement.
#
# The ultraviolet is a daily maximum and is dimensionless. It peaks at 11.6 on
# 13 January and falls to 0.15 in late July, with a January mean of 8.7 against
# June's 0.9 - which is New Zealand, where the summer index is high for the
# latitude because of the ozone above it rather than because of the sun's
# height.
#
# Wind is carried and **nothing in the model reads it** - see docs/validation/verify.md
# E12. It is a daily maximum at 10 m, not a mean at the 2 m most agronomic
# equations expect, which is another reason not to feed it to one yet.
kind = "snapshot"
path = "weather-2023.csv"
sha256 = "8252d1baf9399fd77d6420bc72e4ac0a1e60f59721c5e363f217104f4475e552"
dataset = "Open-Meteo historical weather API (ERA5 reanalysis)"
licence = "CC-BY-4.0. Weather data by Open-Meteo.com, licensed under CC BY 4.0. Generated using Copernicus Climate Change Service information (ERA5)."


[soil]
path = "soil.toml"
sha256 = "523e37beed50db5ecb6c367a5d53cf578823561dc940fbbc6aef31facdc4a36a"

[sward]
path = "sward.toml"
sha256 = "d33109030d022d64db408c55e99751541224e5e0f42f195f56848432f9bd6ce3"

[initial_state]
soil_water_mm = 90.0
grass_kg_dm_per_ha = 2200.0
legume_kg_dm_per_ha = 600.0
soil_mineral_nitrogen_kg_per_ha = 60.0

[grid]
# 40 x 32 cells at 25 m is 1000 by 800 m, which is 80.0 hectares against
# LURDF's published 79. The overshoot is one row of cells, 1.3%, and it is here
# because 79 hectares is not a whole number of 625 m2 cells in any farm-shaped
# rectangle: 79 is prime, so the only exact tilings are strips.
#
# An earlier version of this file used 900 by 800, 72 ha, having taken "72 ha
# under irrigation" from Lincoln University's page as the size of the farm. It
# is the area under the pivots. The farm is 79 ha, and this model does not
# represent irrigation at all.
#
# The origin is the farm rectangle's north-west corner, taken from the centre at
# 1557252.3158 E, 5167862.7895 N. It sits inside the LiDAR tile with room to
# spare: the tile runs 1554400-1559200 E and 5161200-5168400 N, so this farm has
# 137 m of margin at its nearest edge, the northern one.
cols = 40
rows = 32
cell_size_m = 25.0
available_water_west_mm = 60.0   # PLACEHOLDER - demonstration gradient
available_water_east_mm = 140.0  # PLACEHOLDER - demonstration gradient
origin_easting = 1556752.3158
origin_northing = 5168262.7895

# 80 ha at 2 ha gives 40 paddocks of 2.0 ha: 8 across and 5 down at 125 by
# 160 m, which divides this block exactly.
paddock_hectares = 2.0

[terrain]
# Measured ground, not a formula.
#
# The file is not committed - snapshots never are - and the hash is what makes
# that safe: fetch it with the script and this bundle either gets the same
# elevation or refuses to pretend it did.
#
#   scripts/nz-elevation-snapshot.py --lon 172.470 --lat -43.641 \
#       --collection canterbury/selwyn_2023 \
#       --out data/snapshots/lincoln-dem-1m.tiff
#
# Canterbury - Selwyn LiDAR 1m DEM (2023), flown 23 March to 3 May 2023, 1 m,
# already in NZTM2000. Licensed CC BY 4.0, licensor Environment Canterbury,
# produced by Landpro, hosted and processed by Toitu Te Whenua LINZ.
#
# It is a DEM and not a DSM: bare earth, without the shelter belts and the
# woolshed roof, because grass grows on the ground and not on the buildings.
#
# LERC compressed, which needs libtiff built with that codec - see the gis
# feature in vcpkg.json. Without it GDAL will not open the file at all.
kind = "snapshot"
path = "../../snapshots/lincoln-dem-1m.tiff"
sha256 = "2f635bb0cc1097d434ff496a71c3c3372d9e9edfce730ce4f2630ee6bde849c0"

[[mob]]
name = "main mob"
path = "../../species/sheep-ewe.toml"
sha256 = "e64936b7a1195d911c1606d0448ae08f8068d338f342694291f73c1802361bed"
head = 417
paddock = 0
# 417 ewes on 80 hectares is 5.2 a hectare, the same stocking rate
# canterbury-grazed settles at, scaled to this block's area. It is a rate this
# model reports rather than one taken from anywhere, and LURDF is a dairy farm
# carrying about 200 head in any case - the stock here demonstrate the loop,
# not the enterprise.
liveweight_kg = 55.0
age_days = 1500.0

# **The lamb crop, which eats.** Head is zero here and driven by the flock: it
# rises to the season's lambs on 20 August and falls to nothing when they are
# weaned and sold on 1 December. Before this mob existed the farm's lambs were
# born, counted, priced and sold without ever taking a mouthful of grass.
#
# They share the ground with the ewes rather than having their own, which is
# what a lamb does - the mobs graze in turn and the second sees what the first
# left. What they drink is charged to the ewes as lactation, so only the grass
# half of their diet is taken here (TMC Eq. 74).
[[mob]]
name = "lambs"
path = "../../species/sheep-lamb.toml"
sha256 = "89ca2f9a416277c674356d63f9048ce94003b41962b1bf4f08fbe631f597e703"
head = 0
paddock = 0
liveweight_kg = 6.0
age_days = 0.0

# Managed as canterbury-grazed is: set stocked over lambing, rotating the rest
# of the year, after Smith and Dawson (1976). See docs/validation/verify.md.

[[grazing_period]]
name = "winter rotation"
from = "2023-07-01"
to = "2023-08-19"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 35

[[grazing_period]]
name = "lambing"
from = "2023-08-20"
to = "2023-10-28"
system = "set_stocking"

[[grazing_period]]
name = "post-weaning rotation"
from = "2023-10-29"
to = "2023-11-30"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 21

[[grazing_period]]
name = "dry season rotation"
from = "2023-12-01"
to = "2024-06-30"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 35

# The same rules canterbury-grazed carries, so the two differ in their ground
# and their stocking and in nothing else.
[management]
minimum_cover_kg_dm_per_ha = 1600.0
rotation_cover_threshold_kg_dm_per_ha = 2200.0
target_liveweight_gain_kg_per_day = 0.0
maximum_graze_days = 3
minimum_spell_days = 35
supplement_me_mj_per_kg_dm = 10.0
may_buy_feed = true
