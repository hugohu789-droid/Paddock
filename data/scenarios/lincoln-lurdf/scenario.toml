# Lincoln University Research Dairy Farm, on the ground it actually sits on.
#
# The first bundle in this project whose terrain is measured rather than
# generated. Everything else in it is still the placeholder set the Canterbury
# examples use - the weather, the soil and the sward files are byte for byte the
# ones canterbury-grazed carries, and hash to the same values - so what this
# bundle demonstrates is the terrain path and nothing more. It is not a
# description of how LURDF farms.
#
# **The ground is real and nearly flat, and both halves of that matter.** Over
# the whole 4.8 by 7.2 km LiDAR tile the elevation runs from 0.4 m to 26.1 m
# above sea level, mean 7.0 m; over these 72 hectares it moves by a couple of
# metres. Drawn true to scale the farm looks flat because it is flat: this is
# the Canterbury Plains. A viewer wanting to see the shape of it has to
# exaggerate the heights, and the view says by how much when it does.
#
# The boundary is still the placeholder rectangle from
# data/farms/lincoln-research-farms.toml - the right AREA in the wrong SHAPE,
# because LINZ's open cadastre carries no owner and nothing yet says which
# parcels are the farm. See docs/verify.md, open item 15.

[scenario]
name = "lincoln_lurdf"
description = "LURDF's 72 hectares on measured LiDAR ground, with placeholder weather, soil and sward."
engine_version = "0.1.0"
master_seed = 20230323

[run]
# The New Zealand farm year, 1 July to 30 June.
start_date = "2023-07-01"
end_date = "2024-06-30"
latitude_degrees = -43.641

[weather]
kind = "synthetic"
path = "weather.toml"
sha256 = "b59bc98a348677638770e004a1050a9f55f1fd93b5b2346fa4079151588dcb33"

[soil]
path = "soil.toml"
sha256 = "acbbef5a457d8d5a60d016e1fda5706fbb31fd8613c5112b20412d561bfd94ca"

[sward]
path = "sward.toml"
sha256 = "6c7adf252d376044dcd4f26f7867f871cc61ad655bd9208cbe7f51ca96001ede"

[initial_state]
soil_water_mm = 90.0
grass_kg_dm_per_ha = 2200.0
legume_kg_dm_per_ha = 600.0
soil_mineral_nitrogen_kg_per_ha = 60.0

[grid]
# 36 x 32 cells at 25 m is 900 by 800 m, which is 72.0 hectares - the area
# Lincoln University publishes for LURDF, and the same rectangle
# data/farms/lincoln-research-farms.toml carries.
#
# The origin is that rectangle's north-west corner, taken from the farm's centre
# at 1557252.3158 E, 5167862.7895 N. It sits inside the LiDAR tile with room to
# spare: the tile runs 1554400-1559200 E and 5161200-5168400 N, so this farm has
# 137 m of margin at its nearest edge, the northern one.
cols = 36
rows = 32
cell_size_m = 25.0
available_water_west_mm = 60.0   # PLACEHOLDER - demonstration gradient
available_water_east_mm = 140.0  # PLACEHOLDER - demonstration gradient
origin_easting = 1556802.3158
origin_northing = 5168262.7895

# 72 ha at 2 ha gives 36 paddocks of 2.0 ha: 6 across and 6 down at 150 m
# square, which divides this block exactly for once.
paddock_hectares = 2.0

[terrain]
# Measured ground, not a formula.
#
# The file is not committed - snapshots never are - and the hash is what makes
# that safe: fetch it with the script and this bundle either gets the same
# elevation or refuses to pretend it did.
#
#   scripts/nz-elevation-snapshot.py --lon 172.470 --lat -43.641 \
#       --collection canterbury/selwyn_2023 \
#       --out data/snapshots/lincoln-dem-1m.tiff
#
# Canterbury - Selwyn LiDAR 1m DEM (2023), flown 23 March to 3 May 2023, 1 m,
# already in NZTM2000. Licensed CC BY 4.0, licensor Environment Canterbury,
# produced by Landpro, hosted and processed by Toitu Te Whenua LINZ.
#
# It is a DEM and not a DSM: bare earth, without the shelter belts and the
# woolshed roof, because grass grows on the ground and not on the buildings.
#
# LERC compressed, which needs libtiff built with that codec - see the gis
# feature in vcpkg.json. Without it GDAL will not open the file at all.
kind = "snapshot"
path = "../../snapshots/lincoln-dem-1m.tiff"
sha256 = "2f635bb0cc1097d434ff496a71c3c3372d9e9edfce730ce4f2630ee6bde849c0"

[[mob]]
name = "main mob"
path = "../../species/sheep-ewe.toml"
sha256 = "3fa4fe61da611bd49fd64541acaf839c48b9da654912ff7e656d723e16d0adc2"
head = 375
paddock = 0
# 375 ewes on 72 hectares is 5.2 a hectare, the same stocking rate
# canterbury-grazed settles at, scaled to this farm's area. It is a rate this
# model reports rather than one taken from anywhere, and LURDF is a dairy farm
# in any case - the stock here demonstrate the loop, not the enterprise.
liveweight_kg = 55.0
age_days = 1500.0

# Managed as canterbury-grazed is: set stocked over lambing, rotating the rest
# of the year, after Smith and Dawson (1976). See docs/verify.md.

[[grazing_period]]
name = "winter rotation"
from = "2023-07-01"
to = "2023-08-19"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 35

[[grazing_period]]
name = "lambing"
from = "2023-08-20"
to = "2023-10-28"
system = "set_stocking"

[[grazing_period]]
name = "post-weaning rotation"
from = "2023-10-29"
to = "2023-11-30"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 21

[[grazing_period]]
name = "dry season rotation"
from = "2023-12-01"
to = "2024-06-30"
system = "rotational"
maximum_graze_days = 3
minimum_spell_days = 35

# The same rules canterbury-grazed carries, so the two differ in their ground
# and their stocking and in nothing else.
[management]
minimum_cover_kg_dm_per_ha = 1600.0
rotation_cover_threshold_kg_dm_per_ha = 2200.0
target_liveweight_gain_kg_per_day = 0.0
maximum_graze_days = 3
minimum_spell_days = 35
supplement_me_mj_per_kg_dm = 10.0
may_buy_feed = true
